name: Extended deterministic chaos campaign

on:
  workflow_dispatch:
    inputs:
      first_seed:
        description: First deterministic chaos seed
        required: false
        default: "1"
      seed_count:
        description: Number of consecutive seeds (1..16)
        required: false
        default: "16"
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/extended-chaos.yml"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "cmake/native-sdk.nuget.config"
      - "tools/ci/**"
      - "packaging/nuget/TurboRaft.Native.csproj"
      - "vcpkg*.json"

concurrency:
  group: turboraft-extended-chaos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact TurboRaft head
        uses: actions/checkout@v4

      - name: Resolve and validate campaign range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            first=1
            count=1
          else
            first="${{ inputs.first_seed || '1' }}"
            count="${{ inputs.seed_count || '16' }}"
          fi
          [[ "$first" =~ ^[0-9]+$ ]]
          [[ "$count" =~ ^[0-9]+$ ]]
          (( first >= 1 && first <= 4294967295 ))
          (( count >= 1 && count <= 16 ))
          last=$((first + count - 1))
          (( last <= 4294967295 ))
          echo "CHAOS_FIRST_SEED=$first" >> "$GITHUB_ENV"
          echo "CHAOS_SEED_COUNT=$count" >> "$GITHUB_ENV"
          echo "CHAOS_LAST_SEED=$last" >> "$GITHUB_ENV"
          mkdir -p artifacts
          {
            echo "turboraft_sha=$(git rev-parse HEAD)"
            echo "first_seed=$first"
            echo "seed_count=$count"
            echo "last_seed=$last"
            echo "runner=${{ runner.os }}-${{ runner.arch }}"
            echo "event=${{ github.event_name }}"
            echo "scenario=multiprocess-seeded"
            echo "companion_scenario=snapshot-group-isolation"
          } > artifacts/campaign-metadata.txt

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm

      - name: Restore released native SDK dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/turboraft-chaos-dependencies"
          dotnet restore packaging/nuget/TurboRaft.Native.csproj \
            --configfile cmake/native-sdk.nuget.config --packages "$packages" \
            --no-cache --force-evaluate 2>&1 | tee artifacts/sdk-restore.log
          python3 tools/ci/export_native_sdks.py --assets packaging/nuget/obj/project.assets.json \
            --rid linux-x64 --packages salts salts-utils flowmq --metadata artifacts/campaign-metadata.txt

      - name: Record campaign reproduction
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/reproduce.sh <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export TURBORAFT_CHAOS_FIRST_SEED=$CHAOS_FIRST_SEED
          export TURBORAFT_CHAOS_SEED_COUNT=$CHAOS_SEED_COUNT
          ctest --preset ci-linux-release-user \
            -R '^turboraft\.(multiprocess_chaos|snapshot_group_isolation)$' -V
          EOF
          chmod +x artifacts/reproduce.sh

      - name: Build chaos harness
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          set +e
          cmake --preset ci-linux-release-user \
            2>&1 | tee artifacts/configure.log
          configure_rc=${PIPESTATUS[0]}
          if (( configure_rc != 0 )); then
            echo "configure_exit_code=$configure_rc" | tee -a artifacts/campaign-metadata.txt
            exit "$configure_rc"
          fi
          cmake --build --preset ci-linux-release-user --parallel 2 \
            2>&1 | tee artifacts/build.log
          build_rc=${PIPESTATUS[0]}
          set -e
          echo "build_exit_code=$build_rc" | tee -a artifacts/campaign-metadata.txt
          if (( build_rc != 0 )); then
            exit "$build_rc"
          fi

      - name: Run extended deterministic chaos campaign
        shell: bash
        run: |
          set -uo pipefail
          export TURBORAFT_CHAOS_FIRST_SEED="$CHAOS_FIRST_SEED"
          export TURBORAFT_CHAOS_SEED_COUNT="$CHAOS_SEED_COUNT"
          set +e
          ctest --preset ci-linux-release-user -R '^turboraft\.multiprocess_chaos$' -V \
            2>&1 | tee artifacts/chaos.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" | tee -a artifacts/campaign-metadata.txt
          if (( rc != 0 )); then
            echo "Campaign failed. Search chaos.log for 'chaos seed=' to get exact seed/stage/round." >&2
            exit "$rc"
          fi

      - name: Run snapshot catch-up sibling-progress scenario
        shell: bash
        run: |
          set -uo pipefail
          set +e
          ctest --preset ci-linux-release-user \
            -R '^turboraft\.snapshot_group_isolation$' \
            --output-on-failure 2>&1 | tee artifacts/snapshot-group-isolation.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "snapshot_group_isolation_exit_code=$rc" | tee -a artifacts/campaign-metadata.txt
          if (( rc != 0 )); then
            echo "scenario=snapshot-group-isolation failed; reproduce with ctest -R '^turboraft\\.snapshot_group_isolation$' --output-on-failure" >&2
            exit "$rc"
          fi

      - name: Publish campaign summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Extended chaos campaign"
            echo ""
            echo "- commit: $(git rev-parse HEAD)"
            echo "- seeds: $CHAOS_FIRST_SEED..$CHAOS_LAST_SEED ($CHAOS_SEED_COUNT total)"
            echo "- seeded scenario: multiprocess-seeded"
            echo "- companion scenario: snapshot-group-isolation"
            echo "- reproduction: TURBORAFT_CHAOS_FIRST_SEED=$CHAOS_FIRST_SEED TURBORAFT_CHAOS_SEED_COUNT=$CHAOS_SEED_COUNT"
            echo ""
            echo "The seeded harness emits exact seed/stage/round on failure; snapshot evidence is retained separately."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained chaos evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-chaos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            .ci/build/turboraft/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 30
