name: CFlow TurboDB ORM recovery

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "CMake*.txt"
      - "CMake*.cmake"
      - "CMake*.json"
      - "presets/**"
      - "vcpkg*.json"
      - "tools/ci/export_native_sdks.py"
      - "packaging/nuget/TurboRaft.Native.csproj"
      - ".github/actions/setup-native-sdks/**"
      - ".github/workflows/cflow-orm.yml"
  workflow_dispatch:

concurrency:
  group: cflow-orm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  orm-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      - name: Restore TurboDB 2.3.1 and published dependencies
        uses: ./.github/actions/setup-native-sdks
        with:
          rid: linux-x64
          token: ${{ secrets.GITHUB_TOKEN }}
          orm: "true"
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm ccache
      - name: Restore ccache (orm-recovery)
        uses: ./.github/actions/setup-ccache
        with:
          scope: orm-recovery

      - name: Configure ORM qualification
        run: cmake --preset ci-linux-orm-user
      - name: Build complete configured graph
        run: cmake --build --preset ci-linux-orm-user --parallel 4
      - name: Run SQL transaction recovery and process-crash tests
        run: ctest --preset ci-linux-orm-user --output-junit orm-results.xml
      - name: Upload ORM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cflow-orm-diagnostics
          path: |
            .ci/build/turboraft-orm/Testing/Temporary
            .ci/build/turboraft-orm/orm-results.xml
          if-no-files-found: ignore
