name: TurboRaft native SDK release

on:
  push:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/native-sdk-pipeline.yml"
      - ".github/workflows/native-sdk-release.yml"
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: turboraft-native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release:')
    uses: ./.github/workflows/native-sdk-pipeline.yml
    with:
      publish: true
      source_sha: ${{ github.sha }}
      salts_native_candidate_version: ${{ vars.TURBORAFT_SALTS_ACE_CANDIDATE_VERSION }}
      salts_utils_native_version: ${{ vars.TURBORAFT_SALTS_UTILS_NATIVE_VERSION }}
      flowmq_native_version: ${{ vars.TURBORAFT_FLOWMQ_NATIVE_VERSION }}
      chttp_native_version: ${{ vars.TURBORAFT_CHTTP_NATIVE_VERSION }}
    secrets: inherit
