name: v0.2.0 upgrade compatibility

on:
  pull_request:
    paths:
      - "tests/upgrade_compat/**"
      - ".github/workflows/release-compat-v020.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux-v020-to-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      CURRENT_TURBORAFT_ROOT: ${{ github.workspace }}/stage/current
    steps:
      - name: Checkout current TurboRaft head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm

      - name: Restore vcpkg dependencies cache-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$VCPKG_INSTALLED_DIR"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --triplet=x64-linux \
            --only-binarycaching

      - name: Restore released v0.2.0 SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/NuGet-old.config"
          project="$RUNNER_TEMP/turboraft-v020.csproj"
          packages="$RUNNER_TEMP/turboraft-v020-packages"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="TurboRaft.Native" Version="[0.2.0]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" --packages "$packages" --no-cache
          sdk_root() {
            local package="$1" rid="$2" roots=()
            while IFS= read -r root; do roots+=("$root"); done < <(
              find "$packages/$package" -mindepth 3 -maxdepth 3 -type d -path "*/sdk/$rid" -print
            )
            [ "${#roots[@]}" -eq 1 ] || { echo "expected one $package SDK, found ${#roots[@]}" >&2; return 1; }
            printf '%s' "${roots[0]}"
          }
          echo "OLD_TURBORAFT_ROOT=$(sdk_root turboraft.native linux-x64)" >> "$GITHUB_ENV"
          echo "OLD_SALTS_ROOT=$(sdk_root salts.native linux-x64)" >> "$GITHUB_ENV"
          echo "OLD_SALTS_UTILS_ROOT=$(sdk_root saltsutils.native linux-x64)" >> "$GITHUB_ENV"
          echo "OLD_FLOWMQ_ROOT=$(sdk_root flowmq.native linux-x64)" >> "$GITHUB_ENV"

      - name: Restore current released Salts SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/NuGet-current.config"
          project="$RUNNER_TEMP/turboraft-current-deps.csproj"
          packages="$RUNNER_TEMP/turboraft-current-deps"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="*" />
              <PackageReference Include="SaltsUtils.Native" Version="*" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" --packages "$packages" --no-cache
          sdk_root() {
            local package="$1" rid="$2" roots=()
            while IFS= read -r root; do roots+=("$root"); done < <(
              find "$packages/$package" -mindepth 3 -maxdepth 3 -type d -path "*/sdk/$rid" -print
            )
            [ "${#roots[@]}" -eq 1 ] || { echo "expected one $package SDK, found ${#roots[@]}" >&2; return 1; }
            printf '%s' "${roots[0]}"
          }
          current_salts="$(sdk_root salts.native linux-x64)"
          current_utils="$(sdk_root saltsutils.native linux-x64)"
          echo "CURRENT_SALTS_ROOT=$current_salts" >> "$GITHUB_ENV"
          echo "CURRENT_SALTS_UTILS_ROOT=$current_utils" >> "$GITHUB_ENV"
          echo "CURRENT_SALTS_VERSION=$(basename "$(dirname "$(dirname "$current_salts")")")" >> "$GITHUB_ENV"
          echo "CURRENT_SALTS_UTILS_VERSION=$(basename "$(dirname "$(dirname "$current_utils")")")" >> "$GITHUB_ENV"

      - name: Build current storage SDK
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$CURRENT_SALTS_ROOT"
          export SALTS_UTILS_ROOT="$CURRENT_SALTS_UTILS_ROOT"
          export PATH="$CURRENT_SALTS_UTILS_ROOT/bin:$CURRENT_SALTS_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CURRENT_SALTS_UTILS_ROOT/lib:$CURRENT_SALTS_ROOT/lib:$VCPKG_INSTALLED_DIR/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake -S . -B build/current-storage -G Ninja \
            -DTURBORAFT_BUILD_PROFILE=storage-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DCMAKE_INSTALL_PREFIX="$CURRENT_TURBORAFT_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build/current-storage --target install --parallel 2

      - name: Build v0.2.0 fixture producer
        shell: bash
        run: |
          set -euo pipefail
          export TURBORAFT_ROOT="$OLD_TURBORAFT_ROOT"
          export SALTS_ROOT="$OLD_SALTS_ROOT"
          export SALTS_UTILS_ROOT="$OLD_SALTS_UTILS_ROOT"
          export FLOWMQ_ROOT="$OLD_FLOWMQ_ROOT"
          cmake -S tests/upgrade_compat -B build/compat-old -G Ninja \
            -DCOMPAT_ROLE=producer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"
          cmake --build build/compat-old --parallel 2

      - name: Produce v0.2.0 durable and wire fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/v020
          export LD_LIBRARY_PATH="$OLD_SALTS_UTILS_ROOT/lib:$OLD_SALTS_ROOT/lib:$VCPKG_INSTALLED_DIR/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          build/compat-old/turboraft_v020_fixture_producer \
            "$GITHUB_WORKSPACE/artifacts/v020/raft" \
            "$GITHUB_WORKSPACE/artifacts/v020/wire-frame.bin"
          find artifacts/v020 -maxdepth 1 -type f ! -name 'before.sha256' -print0 \
            | sort -z | xargs -0 sha256sum > artifacts/v020/before.sha256

      - name: Build current compatibility consumer
        shell: bash
        run: |
          set -euo pipefail
          export TURBORAFT_ROOT="$CURRENT_TURBORAFT_ROOT"
          export SALTS_ROOT="$CURRENT_SALTS_ROOT"
          export SALTS_UTILS_ROOT="$CURRENT_SALTS_UTILS_ROOT"
          cmake -S tests/upgrade_compat -B build/compat-current -G Ninja \
            -DCOMPAT_ROLE=consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"
          cmake --build build/compat-current --parallel 2

      - name: Qualify v0.2.0 to current upgrade
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$CURRENT_SALTS_UTILS_ROOT/lib:$CURRENT_SALTS_ROOT/lib:$VCPKG_INSTALLED_DIR/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          build/compat-current/turboraft_current_fixture_consumer \
            "$GITHUB_WORKSPACE/artifacts/v020/raft" \
            "$GITHUB_WORKSPACE/artifacts/v020/wire-frame.bin"
          sha256sum -c artifacts/v020/before.sha256
          test -f artifacts/v020/raft.manifest
          sha256sum artifacts/v020/raft.manifest > artifacts/v020/new-sidecars.sha256
          {
            echo "compatibility_result=preexisting-durable-bytes-unchanged"
            echo "new_sidecar=raft.manifest"
          } > artifacts/v020/upgrade-sidecars.txt

      - name: Record compatibility provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "prior_turboraft=0.2.0"
            echo "prior_turboraft_root=$OLD_TURBORAFT_ROOT"
            echo "current_commit=$GITHUB_SHA"
            echo "current_salts=$CURRENT_SALTS_VERSION"
            echo "current_salts_utils=$CURRENT_SALTS_UTILS_VERSION"
            echo "wire_version=6"
            echo "direction=v0.2.0->current"
            echo "rollback=not_declared_by_this_gate"
            echo "read_compatibility=preexisting-files-byte-identical"
            echo "allowed_new_sidecar=raft.manifest"
          } > artifacts/v020/provenance.txt
          cat artifacts/v020/provenance.txt
          cat artifacts/v020/before.sha256

      - name: Upload prior-release compatibility fixture
        uses: actions/upload-artifact@v4
        with:
          name: turboraft-v020-upgrade-fixture-${{ github.sha }}
          path: artifacts/v020
          if-no-files-found: error
          retention-days: 30
