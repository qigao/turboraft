name: v0.2.0 live mixed-version peers

on:
  pull_request:
    branches: [master]
    paths:
      - "tests/compat/v020_live/**"
      - ".github/workflows/v020-live-mixed-peer.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux-v020-current-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      CURRENT_TURBORAFT_ROOT: ${{ github.workspace }}/stage/current
    steps:
      - name: Checkout current TurboRaft
        uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm ccache

      - name: Restore ccache (v020-live-peers)
        uses: ./.github/actions/setup-ccache
        with:
          scope: v020-live-peers

      - name: Restore native link dependencies
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/v020-live-vcpkg"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'JSON'
          {
            "name": "turboraft-v020-live",
            "version-semver": "0.1.0",
            "builtin-baseline": "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01",
            "dependencies": [
              { "name": "pkgconf", "host": true },
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "boringssl",
              "miniaudio",
              "lua",
              { "name": "zeromq", "default-features": false },
              { "name": "xxhash", "version>=": "0.8.3" }
            ]
          }
          JSON
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --triplet=x64-linux \
            --only-binarycaching

      - name: Restore real v0.2.0 SDK graph
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          feed="$RUNNER_TEMP/v020-live-feed"
          packages="$RUNNER_TEMP/v020-live-packages"
          config="$RUNNER_TEMP/v020-live-old.config"
          project="$RUNNER_TEMP/v020-live-old.csproj"
          mkdir -p "$feed" artifacts
          gh release download v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "TurboRaft.Native.0.2.0.nupkg" \
            --dir "$feed"
          sha256sum "$feed/TurboRaft.Native.0.2.0.nupkg" \
            | tee artifacts/v020-package-sha256.txt

          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source "$feed" --name prior --configfile "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GH_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="TurboRaft.Native" Version="[0.2.0]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" \
            --packages "$packages" --no-cache

          sdk_root() {
            local package="$1" rid="$2" roots=()
            while IFS= read -r root; do roots+=("$root"); done < <(
              find "$packages/$package" -mindepth 3 -maxdepth 3 -type d -path "*/sdk/$rid" -print
            )
            [ "${#roots[@]}" -eq 1 ] || {
              echo "expected one $package SDK, found ${#roots[@]}" >&2
              return 1
            }
            printf '%s' "${roots[0]}"
          }
          old_turboraft="$(sdk_root turboraft.native linux-x64)"
          old_salts="$(sdk_root salts.native linux-x64)"
          old_utils="$(sdk_root saltsutils.native linux-x64)"
          echo "OLD_TURBORAFT_ROOT=$old_turboraft" >> "$GITHUB_ENV"
          echo "OLD_SALTS_ROOT=$old_salts" >> "$GITHUB_ENV"
          echo "OLD_SALTS_UTILS_ROOT=$old_utils" >> "$GITHUB_ENV"
          echo "OLD_SALTS_VERSION=$(basename "$(dirname "$(dirname "$old_salts")")")" >> "$GITHUB_ENV"
          echo "OLD_SALTS_UTILS_VERSION=$(basename "$(dirname "$(dirname "$old_utils")")")" >> "$GITHUB_ENV"

      - name: Restore current released Salts SDKs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/v020-live-current.config"
          project="$RUNNER_TEMP/v020-live-current.csproj"
          packages="$RUNNER_TEMP/v020-live-current-packages"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="*" />
              <PackageReference Include="SaltsUtils.Native" Version="*" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" \
            --packages "$packages" --no-cache

          sdk_root() {
            local package="$1" rid="$2" roots=()
            while IFS= read -r root; do roots+=("$root"); done < <(
              find "$packages/$package" -mindepth 3 -maxdepth 3 -type d -path "*/sdk/$rid" -print
            )
            [ "${#roots[@]}" -eq 1 ] || {
              echo "expected one $package SDK, found ${#roots[@]}" >&2
              return 1
            }
            printf '%s' "${roots[0]}"
          }
          current_salts="$(sdk_root salts.native linux-x64)"
          current_utils="$(sdk_root saltsutils.native linux-x64)"
          echo "CURRENT_SALTS_ROOT=$current_salts" >> "$GITHUB_ENV"
          echo "CURRENT_SALTS_UTILS_ROOT=$current_utils" >> "$GITHUB_ENV"
          echo "CURRENT_SALTS_VERSION=$(basename "$(dirname "$(dirname "$current_salts")")")" >> "$GITHUB_ENV"
          echo "CURRENT_SALTS_UTILS_VERSION=$(basename "$(dirname "$(dirname "$current_utils")")")" >> "$GITHUB_ENV"

      - name: Build current core-dev SDK
        shell: bash
        run: |
          set -euo pipefail
          export SALTS_ROOT="$CURRENT_SALTS_ROOT"
          export SALTS_UTILS_ROOT="$CURRENT_SALTS_UTILS_ROOT"
          export PATH="$CURRENT_SALTS_UTILS_ROOT/bin:$CURRENT_SALTS_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$CURRENT_SALTS_UTILS_ROOT/lib:$CURRENT_SALTS_ROOT/lib:$VCPKG_INSTALLED_DIR/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake -S . -B build/current-core -G Ninja \
            -DTURBORAFT_BUILD_PROFILE=core-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DCMAKE_INSTALL_PREFIX="$CURRENT_TURBORAFT_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build/current-core --target install --parallel 2

      - name: Build live peer against real v0.2.0 SDK
        shell: bash
        run: |
          set -euo pipefail
          export TURBORAFT_ROOT="$OLD_TURBORAFT_ROOT"
          export SALTS_ROOT="$OLD_SALTS_ROOT"
          export SALTS_UTILS_ROOT="$OLD_SALTS_UTILS_ROOT"
          cmake -S tests/compat/v020_live -B build/live-old -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"
          cmake --build build/live-old --parallel 2

      - name: Build live peer against current SDK
        shell: bash
        run: |
          set -euo pipefail
          export TURBORAFT_ROOT="$CURRENT_TURBORAFT_ROOT"
          export SALTS_ROOT="$CURRENT_SALTS_ROOT"
          export SALTS_UTILS_ROOT="$CURRENT_SALTS_UTILS_ROOT"
          cmake -S tests/compat/v020_live -B build/live-current -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"
          cmake --build build/live-current --parallel 2

      - name: Run live mixed-version election and commit
        shell: bash
        run: |
          set -euo pipefail
          old_libs="$OLD_TURBORAFT_ROOT/lib:$OLD_SALTS_UTILS_ROOT/lib:$OLD_SALTS_ROOT/lib:$VCPKG_INSTALLED_DIR/x64-linux/lib"
          current_libs="$CURRENT_TURBORAFT_ROOT/lib:$CURRENT_SALTS_UTILS_ROOT/lib:$CURRENT_SALTS_ROOT/lib:$VCPKG_INSTALLED_DIR/x64-linux/lib"
          python3 tests/compat/v020_live/orchestrate.py \
            --old-node "$GITHUB_WORKSPACE/build/live-old/turboraft_v020_live_peer" \
            --current-node "$GITHUB_WORKSPACE/build/live-current/turboraft_v020_live_peer" \
            --old-libs "$old_libs" \
            --current-libs "$current_libs" \
            | tee artifacts/v020-live-mixed.txt
          grep -q '^PASS session leader=v0.2.0 follower=current ' artifacts/v020-live-mixed.txt
          grep -q '^PASS session leader=current follower=v0.2.0 ' artifacts/v020-live-mixed.txt
          grep -q '^PASS: live mixed-version wire-v6 election and commit in both leader directions$' artifacts/v020-live-mixed.txt

      - name: Record mixed-version provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "prior_turboraft=0.2.0"
            echo "prior_salts=$OLD_SALTS_VERSION"
            echo "prior_salts_utils=$OLD_SALTS_UTILS_VERSION"
            echo "current_commit=$GITHUB_SHA"
            echo "current_salts=$CURRENT_SALTS_VERSION"
            echo "current_salts_utils=$CURRENT_SALTS_UTILS_VERSION"
            echo "wire_version=6"
            echo "sessions=v0.2.0-leader->current,current-leader->v0.2.0"
            echo "transport=live-process-pipes"
            echo "network_rtt=not_part_of_this_wire-compatibility-gate"
          } | tee artifacts/v020-live-provenance.txt

      - name: Upload live mixed-version evidence
        uses: actions/upload-artifact@v4
        with:
          name: v020-live-mixed-peer-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
