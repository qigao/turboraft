name: Durable storage baseline

on:
  pull_request:
    paths:
      - "benchmarks/benchmark_proposal_path.c"
      - "benchmarks/proposal_path/**"
      - "benchmarks/storage_ops/**"
      - "benchmarks/read_index/**"
      - "benchmarks/snapshot_catchup/**"
      - ".github/workflows/durable-fsync-benchmark.yml"
  push:
    branches: [master]
    paths:
      - "benchmarks/benchmark_proposal_path.c"
      - "benchmarks/proposal_path/**"
      - "benchmarks/storage_ops/**"
      - "benchmarks/read_index/**"
      - "benchmarks/snapshot_catchup/**"
      - ".github/workflows/durable-fsync-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux-durable-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      SALTS_ROOT: ${{ github.workspace }}/.ci/pkgs/salts
      SALTS_UTILS_ROOT: ${{ github.workspace }}/.ci/pkgs/salts-utils
    steps:
      - name: Checkout TurboRaft
        uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Checkout current Salts
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: master
          path: .ci/src/salts
          persist-credentials: false

      - name: Checkout current SaltsUtils
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: master
          path: .ci/src/salts-utils
          persist-credentials: false

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libtool nasm ninja-build pkg-config

      - name: Restore storage dependency cache
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/turboraft-fsync-vcpkg"
          install="$GITHUB_WORKSPACE/vcpkg_installed"
          mkdir -p "$manifest"
          cat > "$manifest/vcpkg.json" <<'JSON'
          {
            "name": "turboraft-fsync-benchmark",
            "version-semver": "0.1.0",
            "builtin-baseline": "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01",
            "dependencies": [
              { "name": "pkgconf", "host": true },
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "boringssl",
              "gmssl",
              "miniaudio",
              "lua",
              { "name": "zeromq", "default-features": false },
              { "name": "xxhash", "version>=": "0.8.3" }
            ]
          }
          JSON
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$manifest" \
            --x-install-root="$install" \
            --triplet=x64-linux \
            --only-binarycaching

      - name: Build and install current Salts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/salts -B .ci/build/salts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$SALTS_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF
          cmake --build .ci/build/salts --target install --parallel 2
          echo "SALTS_SOURCE_SHA=$(git -C .ci/src/salts rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build and install current SaltsUtils
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$SALTS_ROOT/bin:$PATH"
          cmake -S .ci/src/salts-utils -B .ci/build/salts-utils -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$SALTS_UTILS_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF -DSALTS_UTILS_ENABLE_CFLOW_USB=OFF
          cmake --build .ci/build/salts-utils --target install --parallel 2
          test -x "$SALTS_UTILS_ROOT/bin/salts-idlc"
          echo "SALTS_UTILS_SOURCE_SHA=$(git -C .ci/src/salts-utils rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build installed storage-dev SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$SALTS_UTILS_ROOT/bin:$SALTS_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          prefix="$GITHUB_WORKSPACE/stage/turboraft"
          cmake -S . -B build/storage-dev -G Ninja \
            -DTURBORAFT_BUILD_PROFILE=storage-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build/storage-dev --target install --parallel 2
          echo "TURBORAFT_ROOT=$prefix" >> "$GITHUB_ENV"

      - name: Build installed-SDK benchmark consumer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S benchmarks/proposal_path -B build/durable-fsync -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/durable-fsync --parallel 2

          cmake -S benchmarks/storage_ops -B build/storage-resource -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/storage-resource --parallel 2

          cmake -S benchmarks/read_index -B build/read-index -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/read-index --parallel 2

          cmake -S benchmarks/snapshot_catchup -B build/snapshot-catchup -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/snapshot-catchup --parallel 2

      - name: Run retained fsync distribution benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          TURBORAFT_BENCHMARK_RAW_SAMPLES="$GITHUB_WORKSPACE/artifacts/wal-fsync-raw.csv" \
            build/durable-fsync/turboraft_durable_fsync_benchmark \
            > artifacts/wal-fsync-summary.csv
          test -s artifacts/wal-fsync-summary.csv
          test -s artifacts/wal-fsync-raw.csv
          grep -q '^wal_fsync,1,' artifacts/wal-fsync-summary.csv
          grep -q '^wal_fsync,4,' artifacts/wal-fsync-summary.csv
          grep -q '^wal_fsync,8,' artifacts/wal-fsync-summary.csv
          grep -q '^wal_fsync,16,' artifacts/wal-fsync-summary.csv

          build/storage-resource/turboraft_storage_resource_benchmark \
            > artifacts/storage-resource.csv
          test -s artifacts/storage-resource.csv
          grep -q '^wal_append_rotate,' artifacts/storage-resource.csv
          grep -q '^snapshot_store_retained_suffix,' artifacts/storage-resource.csv
          grep -q '^wal_checkpoint_compaction,' artifacts/storage-resource.csv
          grep -q '^snapshot_install,' artifacts/storage-resource.csv

      - name: Run retained ReadIndex idle and write-load variance benchmark
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          for run in 1 2 3 4 5; do
            TURBORAFT_READ_INDEX_RAW_SAMPLES="$GITHUB_WORKSPACE/artifacts/read-index-raw-$run.csv" \
              build/read-index/turboraft_read_index_benchmark \
              > "artifacts/read-index-run-$run.csv"
            test -s "artifacts/read-index-run-$run.csv"
            test -s "artifacts/read-index-raw-$run.csv"
            grep -q '^read_index_idle,' "artifacts/read-index-run-$run.csv"
            grep -q '^read_index_write_load,' "artifacts/read-index-run-$run.csv"
          done

          python3 - <<'PY'
          import csv
          import glob
          import statistics

          rows = []
          by_phase = {}
          for path in sorted(glob.glob("artifacts/read-index-run-*.csv")):
              run = int(path.rsplit("-", 1)[1].split(".", 1)[0])
              with open(path, newline="", encoding="utf-8") as handle:
                  for row in csv.DictReader(handle):
                      row["run"] = run
                      rows.append(row)
                      by_phase.setdefault(row["phase"], []).append(row)

          with open("artifacts/read-index-runs.csv", "w", newline="", encoding="utf-8") as handle:
              fields = ["run", "phase", "samples", "p50_ns", "p95_ns",
                        "p99_ns", "max_ns", "mean_ns"]
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for row in sorted(rows, key=lambda value: (value["run"], value["phase"])):
                  writer.writerow({field: row[field] for field in fields})

          def cv(values):
              mean = statistics.mean(values)
              return statistics.pstdev(values) / mean if mean else 0.0

          with open("artifacts/read-index-variance.csv", "w", newline="", encoding="utf-8") as handle:
              fields = [
                  "phase", "runs",
                  "p50_min_ns", "p50_median_ns", "p50_max_ns",
                  "p95_min_ns", "p95_median_ns", "p95_max_ns",
                  "p99_min_ns", "p99_median_ns", "p99_max_ns",
                  "p95_cv", "p99_cv"
              ]
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for phase in sorted(by_phase):
                  phase_rows = by_phase[phase]
                  p50 = [int(row["p50_ns"]) for row in phase_rows]
                  p95 = [int(row["p95_ns"]) for row in phase_rows]
                  p99 = [int(row["p99_ns"]) for row in phase_rows]
                  writer.writerow({
                      "phase": phase,
                      "runs": len(phase_rows),
                      "p50_min_ns": min(p50),
                      "p50_median_ns": int(statistics.median(p50)),
                      "p50_max_ns": max(p50),
                      "p95_min_ns": min(p95),
                      "p95_median_ns": int(statistics.median(p95)),
                      "p95_max_ns": max(p95),
                      "p99_min_ns": min(p99),
                      "p99_median_ns": int(statistics.median(p99)),
                      "p99_max_ns": max(p99),
                      "p95_cv": f"{cv(p95):.6f}",
                      "p99_cv": f"{cv(p99):.6f}",
                  })
          PY

          test -s artifacts/read-index-runs.csv
          test -s artifacts/read-index-variance.csv
          grep -q '^read_index_idle,' artifacts/read-index-variance.csv
          grep -q '^read_index_write_load,' artifacts/read-index-variance.csv

      - name: Run retained snapshot wire catch-up variance benchmark
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          for run in 1 2 3 4 5; do
            build/snapshot-catchup/turboraft_snapshot_catchup_benchmark \
              > "artifacts/snapshot-catchup-run-$run.csv"
            test -s "artifacts/snapshot-catchup-run-$run.csv"
            grep -q '^snapshot_wire_catchup,' "artifacts/snapshot-catchup-run-$run.csv"
          done

          python3 - <<'PY'
          import csv
          import glob
          import statistics

          rows = []
          for path in sorted(glob.glob("artifacts/snapshot-catchup-run-*.csv")):
              run = int(path.rsplit("-", 1)[1].split(".", 1)[0])
              with open(path, newline="", encoding="utf-8") as handle:
                  row = next(csv.DictReader(handle))
                  row["run"] = run
                  rows.append(row)

          fields = [
              "run", "phase", "payload_bytes", "chunks",
              "chunk_wire_bytes", "ack_wire_bytes", "total_wire_bytes",
              "wire_amplification", "duration_ns", "throughput_mib_s",
              "user_cpu_ns", "sys_cpu_ns", "max_rss_kb", "fd_count",
              "max_inflight_chunks"
          ]
          with open("artifacts/snapshot-catchup-runs.csv", "w",
                    newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              for row in sorted(rows, key=lambda value: value["run"]):
                  writer.writerow({field: row[field] for field in fields})

          throughputs = [float(row["throughput_mib_s"]) for row in rows]
          durations = [int(row["duration_ns"]) for row in rows]
          total_wire = [int(row["total_wire_bytes"]) for row in rows]
          amplification = [float(row["wire_amplification"]) for row in rows]

          def cv(values):
              mean = statistics.mean(values)
              return statistics.pstdev(values) / mean if mean else 0.0

          with open("artifacts/snapshot-catchup-variance.csv", "w",
                    newline="", encoding="utf-8") as handle:
              fields = [
                  "phase", "runs",
                  "throughput_min_mib_s", "throughput_median_mib_s",
                  "throughput_max_mib_s", "throughput_cv",
                  "duration_min_ns", "duration_median_ns", "duration_max_ns",
                  "total_wire_bytes_min", "total_wire_bytes_max",
                  "wire_amplification_min", "wire_amplification_max"
              ]
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerow({
                  "phase": "snapshot_wire_catchup",
                  "runs": len(rows),
                  "throughput_min_mib_s": f"{min(throughputs):.2f}",
                  "throughput_median_mib_s":
                      f"{statistics.median(throughputs):.2f}",
                  "throughput_max_mib_s": f"{max(throughputs):.2f}",
                  "throughput_cv": f"{cv(throughputs):.6f}",
                  "duration_min_ns": min(durations),
                  "duration_median_ns": int(statistics.median(durations)),
                  "duration_max_ns": max(durations),
                  "total_wire_bytes_min": min(total_wire),
                  "total_wire_bytes_max": max(total_wire),
                  "wire_amplification_min": f"{min(amplification):.6f}",
                  "wire_amplification_max": f"{max(amplification):.6f}",
              })
          PY

          test -s artifacts/snapshot-catchup-runs.csv
          test -s artifacts/snapshot-catchup-variance.csv
          grep -q '^snapshot_wire_catchup,' artifacts/snapshot-catchup-variance.csv

      - name: Record benchmark environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_NAME"
            echo "os=$RUNNER_OS"
            echo "arch=$RUNNER_ARCH"
            echo "salts_sha=$SALTS_SOURCE_SHA"
            echo "salts_utils_sha=$SALTS_UTILS_SOURCE_SHA"
            cmake --version | head -n 1
            cc --version | head -n 1
            uname -a
            df -T /tmp
            lscpu
          } > artifacts/environment.txt
          {
            echo "### Durable fsync distribution"
            echo '~~~csv'
            cat artifacts/wal-fsync-summary.csv
            echo '~~~'
            echo
            echo "### Storage snapshot / compaction / resource baseline"
            echo '~~~csv'
            cat artifacts/storage-resource.csv
            echo '~~~'

            echo
            echo "### ReadIndex idle / durable write-load runs"
            echo '~~~csv'
            cat artifacts/read-index-runs.csv
            echo '~~~'
            echo
            echo "### ReadIndex repeated-run variance"
            echo '~~~csv'
            cat artifacts/read-index-variance.csv
            echo '~~~'

            echo
            echo "### Snapshot wire catch-up runs"
            echo '~~~csv'
            cat artifacts/snapshot-catchup-runs.csv
            echo '~~~'
            echo
            echo "### Snapshot wire catch-up repeated-run variance"
            echo '~~~csv'
            cat artifacts/snapshot-catchup-variance.csv
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retained baseline
        uses: actions/upload-artifact@v4
        with:
          name: durable-storage-baseline-${{ github.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30
