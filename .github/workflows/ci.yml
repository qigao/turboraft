name: TurboRaft CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - feature/multi-group-wire
      - feature/multi-group-multiplex
      - feature/streaming-snapshot
      - feature/multigroup-chaos
      - feature/concurrent-readindex
      - feature/streaming-data-plane
      - feature/proposal-batching-benchmark
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turboraft-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_CACHE_VERSION: ${{ vars.VCPKG_CACHE_VERSION }}

jobs:
  native-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native-inputs
        with:
          operation: prepare
          triplets: x64-linux x64-windows
          token: ${{ secrets.GITHUB_TOKEN }}
  linux:
    needs: native-inputs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-gcc-release-user, ci-llvm-native-asan-ubsan-user, ci-llvm-native-tsan-user]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang pkg-config
      - uses: ./.github/actions/setup-native-inputs
        with:
          triplet: x64-linux
          host-rid: linux-x64
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-native-sdks
        with:
          rid: linux-x64
          packages: salts salts-utils chttp
          orm: "true"
          cache-profile: ${{ matrix.preset }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-sccache
        with:
          compiler: ${{ matrix.preset == 'ci-gcc-release-user' && 'gcc' || 'clang' }}
          configuration: ${{ matrix.preset == 'ci-gcc-release-user' && 'Release' || 'Debug' }}
          profile: ${{ matrix.preset }}
      - name: Configure complete graph
        run: cmake --fresh --preset "${{ matrix.preset }}"
      - name: Build complete graph
        run: cmake --build --preset "${{ matrix.preset }}"
      - name: Run formal tests
        run: ctest --preset "${{ matrix.preset }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.preset }}-diagnostics
          path: build/${{ matrix.preset }}/Testing/Temporary
          if-no-files-found: ignore
  windows-release:
    needs: native-inputs
    uses: ./.github/workflows/windows-msvc-release.yml
    with:
      native-inputs-prepared: true
    secrets: inherit
