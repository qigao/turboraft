name: TurboRaft native SDK qualification

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "CMakeUserPresets.json"
      - "presets/**"
      - ".github/actions/setup-native-sdks/**"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "schema/**"
      - "tools/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "packaging/nuget/**"
      - ".github/workflows/native-sdk-pipeline.yml"
      - ".github/workflows/native-sdk-qualification.yml"
      - ".github/workflows/native-sdk-release.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: turboraft-native-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    uses: ./.github/workflows/native-sdk-pipeline.yml
    with:
      publish: false
      source_sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
