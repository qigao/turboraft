name: Bootstrap TurboRaft 0.2.0 release

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/bootstrap-release-0.2.0.yml"

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure v0.2.0 tag exists
        env:
          TAG: v0.2.0
          TARGET_SHA: 159fe94de151c8aeb830623582f510a4022b1186
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          remote_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            test "$remote_sha" = "$TARGET_SHA"
            echo "$TAG already points to $TARGET_SHA."
            exit 0
          fi
          git tag "$TAG" "$TARGET_SHA"
          git push origin "refs/tags/$TAG"

  publish:
    needs: tag
    uses: ./.github/workflows/native-sdk-pipeline.yml
    with:
      publish: true
      source_sha: 159fe94de151c8aeb830623582f510a4022b1186
    secrets: inherit
