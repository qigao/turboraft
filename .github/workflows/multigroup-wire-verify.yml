          set -euo pipefail

          cat > /tmp/salts_fs_shim.c <<'EOF'
          #include <salts_fs.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <unistd.h>

          static int map_open_flags(int flags)
          {
              int native = 0;
              if (flags & SALTS_FS_O_RDWR) native |= O_RDWR;
              else if (flags & SALTS_FS_O_WRONLY) native |= O_WRONLY;
              else native |= O_RDONLY;
              if (flags & SALTS_FS_O_CREAT) native |= O_CREAT;
              if (flags & SALTS_FS_O_TRUNC) native |= O_TRUNC;
              if (flags & SALTS_FS_O_APPEND) native |= O_APPEND;
              return native;
          }

          salts_file_t salts_fs_open(const char *path, int flags, int mode)
          {
              return open(path, map_open_flags(flags), mode);
          }

          int salts_fs_close(salts_file_t fd)
          {
              return close(fd) == 0 ? 0 : -errno;
          }

          int salts_fs_write(salts_file_t fd, const char *data, size_t len)
          {
              ssize_t rc = write(fd, data, len);
              return rc < 0 ? -errno : (int)rc;
          }

          int salts_fs_pread(salts_file_t fd, char *buf, size_t len,
                             int64_t offset)
          {
              ssize_t rc = pread(fd, buf, len, (off_t)offset);
              return rc < 0 ? -errno : (int)rc;
          }

          int salts_fs_pwrite(salts_file_t fd, const char *data, size_t len,
                              int64_t offset)
          {
              ssize_t rc = pwrite(fd, data, len, (off_t)offset);
              return rc < 0 ? -errno : (int)rc;
          }

          int salts_fs_ftruncate(salts_file_t fd, int64_t length)
          {
              return ftruncate(fd, (off_t)length) == 0 ? 0 : -errno;
          }

          int salts_fs_fsync(salts_file_t fd)
          {
              return fsync(fd) == 0 ? 0 : -errno;
          }

          int salts_fs_lock(salts_file_t fd, int flags,
                            int64_t offset, uint64_t len)
          {
              struct flock lock;
              int cmd = (flags & SALTS_FS_LOCK_NONBLOCK) ?
                            F_SETLK : F_SETLKW;
              lock.l_type = (flags & SALTS_FS_LOCK_SHARED) ?
                                F_RDLCK : F_WRLCK;
              lock.l_whence = SEEK_SET;
              lock.l_start = (off_t)offset;
              lock.l_len = (off_t)len;
              lock.l_pid = 0;
              return fcntl(fd, cmd, &lock) == 0 ? 0 : -errno;
          }

          int salts_fs_unlock(salts_file_t fd, int64_t offset, uint64_t len)
          {
              struct flock lock;
              lock.l_type = F_UNLCK;
              lock.l_whence = SEEK_SET;
              lock.l_start = (off_t)offset;
              lock.l_len = (off_t)len;
              lock.l_pid = 0;
              return fcntl(fd, F_SETLK, &lock) == 0 ? 0 : -errno;
          }

          int salts_fs_rename(const char *old_path, const char *new_path)
          {
              return rename(old_path, new_path) == 0 ? 0 : -errno;
          }

          int64_t salts_fs_seek(salts_file_t fd, int64_t offset, int whence)
          {
              off_t rc = lseek(fd, (off_t)offset, whence);
              return rc < 0 ? -errno : (int64_t)rc;
          }

          int salts_fs_stat(const char *path, salts_fs_stat_t *out)
          {
              struct stat st;
              if (out == NULL) return -EINVAL;
              if (stat(path, &st) != 0) return -errno;
              out->size = (uint64_t)st.st_size;
              out->mode = (int)st.st_mode;
              out->is_file = S_ISREG(st.st_mode);
              out->is_directory = S_ISDIR(st.st_mode);
              out->is_symlink = S_ISLNK(st.st_mode);
              out->atime = 0U;
              out->mtime = 0U;
              out->ctime = 0U;
              return 0;
          }

          int salts_fs_access(const char *path, int mode)
          {
              int native = F_OK;
              if (mode & SALTS_FS_ACCESS_READ) native |= R_OK;
              if (mode & SALTS_FS_ACCESS_WRITE) native |= W_OK;
              if (mode & SALTS_FS_ACCESS_EXEC) native |= X_OK;
              return access(path, native) == 0 ? 0 : -errno;
          }

          int salts_fs_unlink(const char *path)
          {
              return unlink(path) == 0 ? 0 : -errno;
          }
          EOF

          cat > /tmp/wal_stream_behavior.c <<'EOF'
          #include <turboraft/raft_wal_storage.h>
          #include <salts_error.h>
          #include <openssl/sha.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <unistd.h>

          enum {
              SNAPSHOT_BYTES =
                  3U * TR_RAFT_WIRE_MAX_SNAPSHOT_CHUNK_BYTES + 17U
          };

          typedef struct generated_source {
              uint64_t size;
              size_t read_calls;
              size_t max_requested;
          } generated_source_t;

          static int generated_read(void *context,
                                    uint64_t offset,
                                    uint8_t *buffer,
                                    size_t capacity,
                                    size_t *out_size)
          {
              generated_source_t *source =
                  (generated_source_t *)context;
              size_t i;

              if (source == NULL || out_size == NULL ||
                  offset > source->size ||
                  capacity > source->size - offset ||
                  (capacity != 0U && buffer == NULL)) {
                  return SALTS_EINVAL;
              }
              ++source->read_calls;
              if (capacity > source->max_requested) {
                  source->max_requested = capacity;
              }
              for (i = 0U; i < capacity; ++i) {
                  buffer[i] = (uint8_t)((offset + i) & 0xffU);
              }
              *out_size = capacity;
              return SALTS_OK;
          }

          static int compute_digest(uint8_t digest[SHA256_DIGEST_LENGTH])
          {
              generated_source_t source;
              SHA256_CTX sha;
              uint8_t buffer[4096];
              uint64_t offset = 0U;

              memset(&source, 0, sizeof(source));
              source.size = SNAPSHOT_BYTES;
              if (SHA256_Init(&sha) != 1) return 1;
              while (offset < source.size) {
                  uint64_t remaining = source.size - offset;
                  size_t request = remaining < sizeof(buffer) ?
                                       (size_t)remaining : sizeof(buffer);
                  size_t read_size = 0U;
                  if (generated_read(&source, offset, buffer, request,
                                     &read_size) != SALTS_OK ||
                      read_size != request ||
                      SHA256_Update(&sha, buffer, read_size) != 1) {
                      return 2;
                  }
                  offset += read_size;
              }
              return SHA256_Final(digest, &sha) == 1 ? 0 : 3;
          }

          static tr_raft_entry_t one_entry(void)
          {
              tr_raft_entry_t entry;
              memset(&entry, 0, sizeof(entry));
              entry.index = 1U;
              entry.term = 1U;
              entry.command_id = 1U;
              entry.data_length = 1U;
              entry.data[0] = 0x11U;
              return entry;
          }

          int main(void)
          {
              char prefix[160];
              char command[256];
              tr_raft_wal_storage_config_t config;
              tr_raft_wal_storage_t *storage = NULL;
              tr_raft_storage_t adapter;
              tr_raft_wal_recovery_t recovery;
              tr_raft_snapshot_source_t source;
              generated_source_t generated;
              tr_raft_entry_t entry = one_entry();
              tr_raft_conf_t conf;
              uint8_t sample[1024];
              size_t read_size = 0U;
              int rc;

              snprintf(prefix, sizeof(prefix),
                       "/tmp/turboraft-wal-stream-%ld", (long)getpid());
              snprintf(command, sizeof(command), "rm -f %s*", prefix);
              (void)system(command);

              memset(&config, 0, sizeof(config));
              config.path_prefix = prefix;
              config.segment_bytes = TR_RAFT_WAL_MIN_SEGMENT_BYTES;
              config.max_transaction_bytes = 8U * 1024U;
              config.max_segments = 4U;
              config.max_log_entries = 16U;
              config.max_snapshot_bytes = SNAPSHOT_BYTES;
              config.create_if_missing = true;

              memset(&conf, 0, sizeof(conf));
              conf.phase = TR_RAFT_CONF_FINAL;
              conf.transition_id = 1U;
              conf.member_count = 1U;
              conf.members[0].node_id = 1U;
              conf.members[0].roles =
                  TR_RAFT_CONF_OLD_VOTER | TR_RAFT_CONF_NEW_VOTER;

              memset(&generated, 0, sizeof(generated));
              generated.size = SNAPSHOT_BYTES;
              memset(&source, 0, sizeof(source));
              source.context = &generated;
              source.size = SNAPSHOT_BYTES;
              source.read_at = generated_read;
              rc = compute_digest(source.digest);
              if (rc != 0) return 10 + rc;

              if (tr_raft_wal_storage_open(&config, &storage) != SALTS_OK)
                  return 20;
              if (tr_raft_wal_storage_bind(storage, &adapter) != SALTS_OK)
                  return 21;
              if (adapter.begin(adapter.context) != SALTS_OK ||
                  adapter.write_hard_state(adapter.context, 1U, 1U) !=
                      SALTS_OK ||
                  adapter.append_log(adapter.context, &entry, 1U) !=
                      SALTS_OK ||
                  adapter.write_commit_index(adapter.context, 1U) !=
                      SALTS_OK ||
                  adapter.commit(adapter.context) != SALTS_OK)
                  return 22;

              if (tr_raft_wal_storage_store_snapshot_source(
                      storage, 1U, 1U, &conf, &source) != SALTS_OK)
                  return 23;
              if (generated.read_calls < 4U ||
                  generated.max_requested >
                      TR_RAFT_WIRE_MAX_SNAPSHOT_CHUNK_BYTES)
                  return 24;

              if (tr_raft_wal_storage_close(storage) != SALTS_OK)
                  return 25;
              storage = NULL;
              config.create_if_missing = false;
              if (tr_raft_wal_storage_open(&config, &storage) != SALTS_OK)
                  return 26;

              memset(&recovery, 0, sizeof(recovery));
              if (tr_raft_wal_storage_load(storage, &recovery) != SALTS_OK)
                  return 27;
              if (recovery.snapshot_data != NULL ||
                  recovery.snapshot_source.read_at == NULL ||
                  recovery.snapshot_source.size != SNAPSHOT_BYTES)
                  return 28;
              if (recovery.snapshot_source.read_at(
                      recovery.snapshot_source.context, 65536U,
                      sample, sizeof(sample), &read_size) != SALTS_OK ||
                  read_size != sizeof(sample) ||
                  sample[0] != (uint8_t)(65536U & 0xffU) ||
                  sample[1023U] !=
                      (uint8_t)((65536U + 1023U) & 0xffU))
                  return 29;

              tr_raft_wal_recovery_destroy(&recovery);
              if (tr_raft_wal_storage_close(storage) != SALTS_OK)
                  return 30;
              (void)system(command);
              return 0;
          }
          EOF

          cc -std=c11 -Wall -Wextra \
            -D_DEFAULT_SOURCE=1 -D_POSIX_C_SOURCE=200809L \
            -Iinclude \
            -Isrc \
            -Isrc/core \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/concurrency/include \
            -I../salts/cmeta/include \
            -I../salts/cstl/include \
            -I../xxhash \
            /tmp/wal_stream_behavior.c \
            /tmp/salts_fs_shim.c \
            src/storage/raft_wal_storage.c \
            src/core/raft_configuration.c \
            ../xxhash/xxhash.c \
            -lcrypto \
            -o /tmp/wal_stream_behavior
          /tmp/wal_stream_behavior

