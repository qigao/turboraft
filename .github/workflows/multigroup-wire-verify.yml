name: Multi-group wire verification

on:
  push:
    branches:
      - feature/multi-group-wire
      - feature/multi-group-multiplex
      - feature/streaming-snapshot
      - feature/multigroup-chaos
      - feature/concurrent-readindex
      - feature/streaming-data-plane
  workflow_dispatch:

concurrency:
  group: multigroup-wire-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TurboRaft
        uses: actions/checkout@v4

      - name: Checkout public header dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          git clone --depth 1 https://github.com/qigao/salts.git ../salts             > diagnostics/salts-clone.log 2>&1
          git clone --depth 1 https://github.com/qigao/salts-utils.git ../salts-utils
          git clone --depth 1 https://github.com/Cyan4973/xxHash.git ../xxhash             > diagnostics/salts-utils-clone.log 2>&1

      - name: Compile changed production sources and contract test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          INC=(
            -Iinclude
            -Isrc
            -Isrc/core
            -Isrc/wire/generated
            -I../salts/utils/include
            -I../salts/platform/include
            -I../salts/concurrency/include
            -I../salts/cnet/include
            -I../salts/native-io/include
            -I../salts/cstl/include
            -I../salts/cmeta/include
            -I../salts/tinytest/include
            -I../salts-utils/tbe/data_bind
            -I../salts-utils/tbe/schema/include
            -I../xxhash
          )

          run_check() {
            local label="$1"
            shift
            set +e
            local logfile="diagnostics/${label}.log"
            "$@" > "$logfile" 2>&1
            local rc=$?
            set -e
            {
              echo "### ${label}"
              echo '~~~text'
              tail -n 120 "$logfile"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            cat "$logfile"
            return "$rc"
          }

          run_check "raft_wire_codec.c"             cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             "${INC[@]}" -fsyntax-only src/wire/raft_wire_codec.c
          run_check "raft_peer_handshake.c"             cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             "${INC[@]}" -fsyntax-only src/transport/raft_peer_handshake.c
          run_check "raft_transport.c"             cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             "${INC[@]}" -fsyntax-only src/transport/raft_transport.c
          run_check "raft_cnet_peer.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/transport -fsyntax-only \
            src/transport/raft_cnet_peer.c
          run_check "raft_snapshot_sender.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            src/snapshot/raft_snapshot_sender.c
          run_check "raft_snapshot_coordinator.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/service -fsyntax-only \
            src/service/raft_snapshot_coordinator.c
          run_check "raft_snapshot_peer.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/service -fsyntax-only \
            src/service/raft_snapshot_peer.c
          run_check "raft_snapshot_manager.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/service -fsyntax-only \
            src/service/raft_snapshot_manager.c
          run_check "raft_service.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/service -fsyntax-only \
            src/service/raft_service.c
          run_check "raft_group_queue.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/transport -fsyntax-only \
            src/transport/raft_group_queue.c
          run_check "test_raft_multigroup_wire.c"             cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             "${INC[@]}" -fsyntax-only tests/core/test_raft_multigroup_wire.c
          run_check "test_raft_group_queue.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/transport -fsyntax-only \
            tests/core/test_raft_group_queue.c
          run_check "test_raft_transport.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_transport.c
          run_check "test_raft_cnet_peer.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_cnet_peer.c
          run_check "test_raft_snapshot_sender.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_snapshot_sender.c
          run_check "test_raft_snapshot_coordinator.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/service -fsyntax-only \
            tests/core/test_raft_snapshot_coordinator.c
          run_check "test_raft_snapshot_manager_runtime.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_snapshot_manager_runtime.c
          run_check "raft_wal_storage.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            src/storage/raft_wal_storage.c
          run_check "test_raft_wal_storage.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_wal_storage.c
          run_check "test_raft_snapshot_peer.c"             cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             "${INC[@]}" -Isrc/service -fsyntax-only tests/core/test_raft_snapshot_peer.c
          run_check "test_raft_snapshot_receiver.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_snapshot_receiver.c
          run_check "test_raft_snapshot_manager.c"             cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             "${INC[@]}" -Isrc/service -fsyntax-only tests/core/test_raft_snapshot_manager.c
          run_check "test_raft_read_index.c" \
          run_check "raft_data_stream.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            src/stream/raft_data_stream.c
          run_check "test_raft_data_stream.c" \
          run_check "test_raft_runtime.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_runtime.c
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_data_stream.c
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_read_index.c
          run_check "test_raft_service.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_service.c
          run_check "test_raft_snapshot_policy.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -fsyntax-only \
            tests/core/test_raft_snapshot_policy.c
          run_check "raft_multiprocess_node.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Itests/chaos -fsyntax-only \
            tests/chaos/raft_multiprocess_node.c
          run_check "test_raft_multiprocess_chaos.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Itests/chaos -fsyntax-only \
            tests/chaos/test_raft_multiprocess_chaos.c
          run_check "test_raft_snapshot_group_isolation.c" \
            cc -std=c11 -Wall -Wextra \
            -Werror=implicit-function-declaration \
            -Werror=incompatible-pointer-types \
            -Werror=int-conversion \
            -Werror=return-type \
            "${INC[@]}" -Isrc/transport -fsyntax-only \
            tests/core/test_raft_snapshot_group_isolation.c

      - name: Run retryable state-machine apply behavior
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra \
            -Iinclude \
            -Isrc \
            -Isrc/core \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/cstl/include \
            -I../salts/cmeta/include \
            -I../salts/tinytest/include \
            tests/core/test_raft_runtime.c \
            src/runtime/raft_runtime.c \
            src/stream/raft_data_stream.c \
            src/core/raft_core.c \
            src/core/raft_configuration.c \
            src/core/raft_membership.c \
            src/core/raft_membership_transition.c \
            src/core/raft_peer_set.c \
            src/core/raft_log.c \
            ../salts/cstl/src/vec.c \
            ../salts/tinytest/src/tinytest.c \
            ../salts/tinytest/src/tinymock.c \
            -lcrypto \
            -o /tmp/turboraft_runtime_tests
          /tmp/turboraft_runtime_tests

      - name: Run streaming DataStream behavior
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra \
            -Iinclude \
            -Isrc \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/cstl/include \
            -I../salts/cmeta/include \
            -I../salts/tinytest/include \
            tests/core/test_raft_data_stream.c \
            src/stream/raft_data_stream.c \
            src/core/raft_configuration.c \
            ../salts/tinytest/src/tinytest.c \
            ../salts/tinytest/src/tinymock.c \
            -lcrypto \
            -o /tmp/turboraft_data_stream_tests
          /tmp/turboraft_data_stream_tests

      - name: Run concurrent ReadIndex behavior
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra \
            -Iinclude \
            -Isrc \
            -Isrc/core \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/cstl/include \
            -I../salts/cmeta/include \
            -I../salts/tinytest/include \
            tests/core/test_raft_read_index.c \
            src/core/raft_core.c \
            src/core/raft_configuration.c \
            src/core/raft_membership.c \
            src/core/raft_membership_transition.c \
            src/core/raft_peer_set.c \
            src/core/raft_log.c \
            ../salts/cstl/src/vec.c \
            ../salts/tinytest/src/tinytest.c \
            ../salts/tinytest/src/tinymock.c \
            -o /tmp/turboraft_read_index_tests
          /tmp/turboraft_read_index_tests

      - name: Run Service completed ReadIndex queue behavior
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra \
            -Iinclude \
            -Isrc \
            -Isrc/core \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/cstl/include \
            -I../salts/cmeta/include \
            -I../salts/tinytest/include \
            tests/core/test_raft_service.c \
            src/service/raft_service.c \
            src/runtime/raft_runtime.c \
            src/core/raft_core.c \
            src/core/raft_configuration.c \
            src/core/raft_membership.c \
            src/core/raft_membership_transition.c \
            src/core/raft_peer_set.c \
            src/core/raft_log.c \
            ../salts/cstl/src/vec.c \
            ../salts/tinytest/src/tinytest.c \
            ../salts/tinytest/src/tinymock.c \
            -o /tmp/turboraft_service_tests
          /tmp/turboraft_service_tests

      - name: Run bounded fair group queue behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/group_queue_behavior.c <<'EOF'
          #include "raft_group_queue.h"
          #include <salts_error.h>
          #include <stdint.h>
          #include <string.h>

          static void release_owned(tr_raft_owned_transport_payload_t *owned)
          {
              if (owned != NULL) {
                  memset(owned, 0, sizeof(*owned));
              }
          }

          static tr_raft_owned_transport_payload_t make_item(
              tr_raft_group_id_t group_id,
              uint64_t term)
          {
              tr_raft_owned_transport_payload_t owned;
              memset(&owned, 0, sizeof(owned));
              owned.payload.group_id = group_id;
              owned.payload.kind = TR_RAFT_WIRE_PAYLOAD_RAFT;
              owned.payload.data.raft.type = TR_RAFT_MSG_HEARTBEAT_REQUEST;
              owned.payload.data.raft.from = 1U;
              owned.payload.data.raft.to = 2U;
              owned.payload.data.raft.term = term;
              return owned;
          }

          int main(void)
          {
              tr_raft_group_queue_t queue;
              tr_raft_group_queue_config_t config;
              tr_raft_owned_transport_payload_t item;
              const tr_raft_owned_transport_payload_t *front = NULL;
              tr_raft_group_queue_token_t token;
              const tr_raft_group_id_t groups[] = {
                  10U, 20U, 10U, 20U, 10U
              };
              const uint64_t terms[] = {1U, 4U, 2U, 5U, 3U};
              size_t i;

              memset(&queue, 0, sizeof(queue));
              memset(&config, 0, sizeof(config));
              config.max_groups = 2U;
              config.total_item_capacity = 5U;
              config.total_data_bytes = 10U;
              config.per_group_item_capacity = 3U;
              config.per_group_data_bytes = 6U;
              config.release = release_owned;

              if (tr_raft_group_queue_init(&queue, &config) != SALTS_OK) {
                  return 10;
              }

              item = make_item(10U, 1U);
              if (tr_raft_group_queue_enqueue(&queue, &item, 2U) != SALTS_OK)
                  return 11;
              item = make_item(10U, 2U);
              if (tr_raft_group_queue_enqueue(&queue, &item, 2U) != SALTS_OK)
                  return 12;
              item = make_item(10U, 3U);
              if (tr_raft_group_queue_enqueue(&queue, &item, 2U) != SALTS_OK)
                  return 13;
              item = make_item(20U, 4U);
              if (tr_raft_group_queue_enqueue(&queue, &item, 2U) != SALTS_OK)
                  return 14;
              item = make_item(20U, 5U);
              if (tr_raft_group_queue_enqueue(&queue, &item, 2U) != SALTS_OK)
                  return 15;

              item = make_item(20U, 6U);
              if (tr_raft_group_queue_enqueue(&queue, &item, 1U) !=
                  SALTS_ENOSPC)
                  return 16;

              for (i = 0U; i < 5U; ++i) {
                  if (tr_raft_group_queue_peek_next(
                          &queue, &token, &front) != SALTS_OK)
                      return 20;
                  if (front->payload.group_id != groups[i] ||
                      front->payload.data.raft.term != terms[i])
                      return 21;
                  if (tr_raft_group_queue_pop(
                          &queue, token, &item, NULL) != SALTS_OK)
                      return 22;
              }

              if (tr_raft_group_queue_size(&queue) != 0U ||
                  tr_raft_group_queue_active_groups(&queue) != 0U ||
                  tr_raft_group_queue_data_bytes(&queue) != 0U)
                  return 30;

              tr_raft_group_queue_destroy(&queue);
              return 0;
          }
          EOF

          cc -std=c11 -Wall -Wextra \
            -Iinclude \
            -Isrc/transport \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/concurrency/include \
            -I../salts/cmeta/include \
            -I../salts/cstl/include \
            /tmp/group_queue_behavior.c \
            src/transport/raft_group_queue.c \
            -o /tmp/group_queue_behavior
          /tmp/group_queue_behavior

      - name: Run group routing fault-isolation behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/group_routing_behavior.c <<'EOF'
          #include <turboraft/raft_transport.h>
          #include <salts_error.h>

          #include <stdlib.h>
          #include <string.h>

          struct tr_raft_wire_codec {
              int unused;
          };

          static tr_raft_wire_metadata_t g_metadata;
          static tr_raft_message_t g_message;

          int tr_raft_wire_codec_create(tr_raft_wire_codec_t **out_codec)
          {
              if (out_codec == NULL) return SALTS_EINVAL;
              *out_codec = (tr_raft_wire_codec_t *)calloc(1U, sizeof(**out_codec));
              return *out_codec == NULL ? SALTS_ENOMEM : SALTS_OK;
          }

          void tr_raft_wire_codec_destroy(tr_raft_wire_codec_t *codec)
          {
              free(codec);
          }

          int tr_raft_wire_peek_payload_kind(
              const uint8_t *frame,
              size_t frame_length,
              tr_raft_wire_payload_kind_t *out_kind)
          {
              (void)frame;
              if (frame_length != TR_RAFT_WIRE_HEADER_SIZE ||
                  out_kind == NULL) {
                  return SALTS_EPROTO;
              }
              *out_kind = TR_RAFT_WIRE_PAYLOAD_RAFT;
              return SALTS_OK;
          }

          int tr_raft_wire_decode(
              tr_raft_wire_codec_t *codec,
              const uint8_t *frame,
              size_t frame_length,
              tr_raft_wire_metadata_t *metadata,
              tr_raft_message_t *message)
          {
              (void)codec;
              (void)frame;
              if (frame_length != TR_RAFT_WIRE_HEADER_SIZE ||
                  metadata == NULL || message == NULL) {
                  return SALTS_EPROTO;
              }
              *metadata = g_metadata;
              *message = g_message;
              return SALTS_OK;
          }

          int tr_raft_wire_decode_snapshot_chunk(
              tr_raft_wire_codec_t *codec,
              const uint8_t *frame,
              size_t frame_length,
              tr_raft_wire_metadata_t *metadata,
              tr_raft_snapshot_chunk_t *chunk)
          {
              (void)codec; (void)frame; (void)frame_length;
              (void)metadata; (void)chunk;
              return SALTS_EPROTO;
          }

          int tr_raft_wire_decode_snapshot_ack(
              tr_raft_wire_codec_t *codec,
              const uint8_t *frame,
              size_t frame_length,
              tr_raft_wire_metadata_t *metadata,
              tr_raft_snapshot_ack_t *ack)
          {
              (void)codec; (void)frame; (void)frame_length;
              (void)metadata; (void)ack;
              return SALTS_EPROTO;
          }

          int tr_raft_wire_decode_data_chunk(
              tr_raft_wire_codec_t *codec,
              const uint8_t *frame,
              size_t frame_length,
              tr_raft_wire_metadata_t *metadata,
              tr_raft_data_chunk_t *chunk)
          {
              (void)codec; (void)frame; (void)frame_length;
              (void)metadata; (void)chunk;
              return SALTS_EPROTO;
          }

          int tr_raft_wire_decode_data_ack(
              tr_raft_wire_codec_t *codec,
              const uint8_t *frame,
              size_t frame_length,
              tr_raft_wire_metadata_t *metadata,
              tr_raft_data_ack_t *ack)
          {
              (void)codec; (void)frame; (void)frame_length;
              (void)metadata; (void)ack;
              return SALTS_EPROTO;
          }

          int tr_raft_wire_encode(
              tr_raft_wire_codec_t *codec,
              const tr_raft_wire_metadata_t *metadata,
              const tr_raft_message_t *message,
              uint8_t *output,
              size_t output_capacity,
              size_t *output_length)
          {
              (void)codec; (void)metadata; (void)message;
              (void)output; (void)output_capacity; (void)output_length;
              return SALTS_EPROTONOSUPPORT;
          }

          int tr_raft_wire_encode_snapshot_chunk(
              tr_raft_wire_codec_t *codec,
              const tr_raft_wire_metadata_t *metadata,
              const tr_raft_snapshot_chunk_t *chunk,
              uint8_t *output,
              size_t output_capacity,
              size_t *output_length)
          {
              (void)codec; (void)metadata; (void)chunk;
              (void)output; (void)output_capacity; (void)output_length;
              return SALTS_EPROTONOSUPPORT;
          }

          int tr_raft_wire_encode_snapshot_ack(
              tr_raft_wire_codec_t *codec,
              const tr_raft_wire_metadata_t *metadata,
              const tr_raft_snapshot_ack_t *ack,
              uint8_t *output,
              size_t output_capacity,
              size_t *output_length)
          {
              (void)codec; (void)metadata; (void)ack;
              (void)output; (void)output_capacity; (void)output_length;
              return SALTS_EPROTONOSUPPORT;
          }

          int tr_raft_wire_encode_data_chunk(
              tr_raft_wire_codec_t *codec,
              const tr_raft_wire_metadata_t *metadata,
              const tr_raft_data_chunk_t *chunk,
              uint8_t *output,
              size_t output_capacity,
              size_t *output_length)
          {
              (void)codec; (void)metadata; (void)chunk;
              (void)output; (void)output_capacity; (void)output_length;
              return SALTS_EPROTONOSUPPORT;
          }

          int tr_raft_wire_encode_data_ack(
              tr_raft_wire_codec_t *codec,
              const tr_raft_wire_metadata_t *metadata,
              const tr_raft_data_ack_t *ack,
              uint8_t *output,
              size_t output_capacity,
              size_t *output_length)
          {
              (void)codec; (void)metadata; (void)ack;
              (void)output; (void)output_capacity; (void)output_length;
              return SALTS_EPROTONOSUPPORT;
          }

          int tr_raft_handshake_result_validate(
              const tr_raft_handshake_result_t *result,
              const tr_raft_cluster_id_t *cluster_id,
              tr_raft_node_id_t local_node_id,
              tr_raft_node_id_t peer_node_id)
          {
              if (result == NULL || cluster_id == NULL || !result->complete ||
                  result->local_node_id != local_node_id ||
                  result->peer_node_id != peer_node_id ||
                  memcmp(result->cluster_id.bytes, cluster_id->bytes,
                         sizeof(cluster_id->bytes)) != 0) {
                  return SALTS_EPROTO;
              }
              return SALTS_OK;
          }

          static int route(void *context,
                           const tr_raft_transport_payload_t *payload)
          {
              size_t *accepted = (size_t *)context;

              if (payload->group_id == 999U) return SALTS_ENOENT;
              if (payload->group_id == 998U) return SALTS_ESHUTDOWN;
              ++*accepted;
              return SALTS_OK;
          }

          static void put_u32(uint8_t *p, uint32_t value)
          {
              p[0] = (uint8_t)(value >> 24U);
              p[1] = (uint8_t)(value >> 16U);
              p[2] = (uint8_t)(value >> 8U);
              p[3] = (uint8_t)value;
          }

          static int feed_group(
              tr_raft_transport_session_t *session,
              tr_raft_group_id_t group_id,
              uint64_t message_id)
          {
              uint8_t packet[
                  TR_RAFT_TRANSPORT_LENGTH_PREFIX_SIZE +
                  TR_RAFT_WIRE_HEADER_SIZE];

              memset(packet, 0, sizeof(packet));
              put_u32(packet, TR_RAFT_WIRE_HEADER_SIZE);
              g_metadata.group_id = group_id;
              g_metadata.message_id = message_id;
              return tr_raft_transport_feed(session, packet, sizeof(packet));
          }

          int main(void)
          {
              tr_raft_transport_session_config_t config;
              tr_raft_handshake_result_t handshake;
              tr_raft_transport_session_t *session = NULL;
              tr_raft_transport_status_t status;
              size_t accepted = 0U;
              size_t i;

              memset(&config, 0, sizeof(config));
              memset(&handshake, 0, sizeof(handshake));
              memset(&g_metadata, 0, sizeof(g_metadata));
              memset(&g_message, 0, sizeof(g_message));

              for (i = 0U; i < sizeof(config.cluster_id.bytes); ++i) {
                  config.cluster_id.bytes[i] = (uint8_t)(41U + i);
              }
              g_metadata.cluster_id = config.cluster_id;
              g_message.type = TR_RAFT_MSG_HEARTBEAT_REQUEST;
              g_message.from = 1U;
              g_message.to = 2U;
              g_message.term = 7U;

              handshake.complete = 1;
              handshake.cluster_id = config.cluster_id;
              handshake.local_node_id = 2U;
              handshake.peer_node_id = 1U;
              handshake.peer_process_incarnation.bytes[0] = 1U;
              handshake.wire_major = TR_RAFT_HANDSHAKE_WIRE_MAJOR;
              handshake.wire_minor = TR_RAFT_HANDSHAKE_WIRE_MINOR;
              handshake.max_frame_size = TR_RAFT_WIRE_MAX_FRAME_SIZE;
              handshake.max_snapshot_chunk_size =
                  TR_RAFT_WIRE_MAX_SNAPSHOT_CHUNK_BYTES;

              config.local_node_id = 2U;
              config.peer_node_id = 1U;
              config.first_outbound_message_id = 1U;
              config.handshake = &handshake;
              config.on_payload = route;
              config.payload_context = &accepted;

              if (tr_raft_transport_session_create(&config, &session) !=
                  SALTS_OK) return 10;

              if (feed_group(session, 999U, 1U) != SALTS_OK) return 11;
              if (tr_raft_transport_get_status(session, &status) != SALTS_OK)
                  return 12;
              if (status.state != TR_RAFT_TRANSPORT_STATE_READY ||
                  status.group_routing_rejections != 1U ||
                  status.last_rejected_group_id != 999U ||
                  status.last_group_routing_error != SALTS_ENOENT)
                  return 13;

              if (feed_group(session, 998U, 2U) != SALTS_OK) return 14;
              if (tr_raft_transport_get_status(session, &status) != SALTS_OK)
                  return 15;
              if (status.state != TR_RAFT_TRANSPORT_STATE_READY ||
                  status.group_routing_rejections != 2U ||
                  status.last_rejected_group_id != 998U ||
                  status.last_group_routing_error != SALTS_ESHUTDOWN)
                  return 16;

              if (feed_group(session, 100U, 3U) != SALTS_OK) return 17;
              if (accepted != 1U) return 18;
              if (tr_raft_transport_get_status(session, &status) != SALTS_OK)
                  return 19;
              if (status.state != TR_RAFT_TRANSPORT_STATE_READY) return 20;

              if (tr_raft_transport_session_destroy(session) != SALTS_OK)
                  return 21;
              return 0;
          }
          EOF

          cc -std=c11 -Wall -Wextra \
            -Iinclude \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/concurrency/include \
            -I../salts/cmeta/include \
            /tmp/group_routing_behavior.c \
            src/transport/raft_transport.c \
            -o /tmp/group_routing_behavior
          /tmp/group_routing_behavior

      - name: Run bounded streaming snapshot sender behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/streaming_sender_behavior.c <<'EOF'
          #include <turboraft/raft_snapshot_sender.h>
          #include <salts_error.h>

          #include <stdint.h>
          #include <string.h>

          typedef struct generated_source {
              uint64_t size;
              size_t reads;
              size_t max_requested;
              size_t releases;
          } generated_source_t;

          static int read_at(void *context,
                             uint64_t offset,
                             uint8_t *buffer,
                             size_t capacity,
                             size_t *out_size)
          {
              generated_source_t *source = (generated_source_t *)context;
              size_t i;

              if (source == NULL || out_size == NULL ||
                  offset > source->size ||
                  capacity > source->size - offset ||
                  (capacity != 0U && buffer == NULL)) {
                  return SALTS_EINVAL;
              }
              ++source->reads;
              if (capacity > source->max_requested) {
                  source->max_requested = capacity;
              }
              for (i = 0U; i < capacity; ++i) {
                  buffer[i] = (uint8_t)((offset + i) & 0xffU);
              }
              *out_size = capacity;
              return SALTS_OK;
          }

          static void release_source(void *context)
          {
              generated_source_t *source = (generated_source_t *)context;
              if (source != NULL) ++source->releases;
          }

          int main(void)
          {
              const uint64_t snapshot_size =
                  3U * TR_RAFT_WIRE_MAX_SNAPSHOT_CHUNK_BYTES + 17U;
              const tr_raft_conf_t configuration = {
                  TR_RAFT_CONF_FINAL, 0U, 1U,
                  {{1U, TR_RAFT_CONF_OLD_VOTER |
                        TR_RAFT_CONF_NEW_VOTER}}
              };
              tr_raft_snapshot_sender_config_t config;
              tr_raft_snapshot_sender_t *sender = NULL;
              tr_raft_snapshot_source_t source;
              generated_source_t generated;
              tr_raft_snapshot_chunk_t chunk;
              tr_raft_snapshot_ack_t ack;
              uint64_t offset = 0U;
              size_t chunks = 0U;

              memset(&config, 0, sizeof(config));
              memset(&source, 0, sizeof(source));
              memset(&generated, 0, sizeof(generated));
              memset(&ack, 0, sizeof(ack));

              generated.size = snapshot_size;
              source.context = &generated;
              source.size = snapshot_size;
              memset(source.digest, 0x5a, sizeof(source.digest));
              source.read_at = read_at;
              source.release = release_source;

              config.self_id = 1U;
              config.peer_id = 2U;
              config.max_snapshot_bytes = (size_t)snapshot_size;
              config.chunk_size = TR_RAFT_WIRE_MAX_SNAPSHOT_CHUNK_BYTES;
              config.max_inflight_chunks = 1U;

              if (tr_raft_snapshot_sender_create(&config, &sender) !=
                  SALTS_OK) return 10;
              if (tr_raft_snapshot_sender_begin_source(
                      sender, 7U, 9U, 6U, &configuration, &source) !=
                  SALTS_OK) return 11;

              ack.from = 2U;
              ack.to = 1U;
              ack.term = 7U;
              ack.snapshot_index = 9U;
              ack.snapshot_size = snapshot_size;
              ack.accepted = true;
              memcpy(ack.snapshot_digest, source.digest,
                     sizeof(ack.snapshot_digest));

              while (offset < snapshot_size) {
                  size_t i;
                  if (tr_raft_snapshot_sender_next_chunk(sender, &chunk) !=
                      SALTS_OK) return 20;
                  if (chunk.snapshot_offset != offset ||
                      chunk.data_length >
                          TR_RAFT_WIRE_MAX_SNAPSHOT_CHUNK_BYTES)
                      return 21;
                  for (i = 0U; i < chunk.data_length; ++i) {
                      if (chunk.data[i] !=
                          (uint8_t)((offset + i) & 0xffU))
                          return 22;
                  }
                  offset += chunk.data_length;
                  ++chunks;
                  ack.next_offset = offset;
                  if (tr_raft_snapshot_sender_acknowledge(
                          sender, &ack) != SALTS_OK)
                      return 23;
              }

              if (chunks != 4U ||
                  generated.reads != 4U ||
                  generated.max_requested >
                      TR_RAFT_WIRE_MAX_SNAPSHOT_CHUNK_BYTES ||
                  generated.releases != 1U)
                  return 30;

              tr_raft_snapshot_sender_destroy(sender);
              return generated.releases == 1U ? 0 : 31;
          }
          EOF

          cc -std=c11 -Wall -Wextra \
            -Iinclude \
            -Isrc/core \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/concurrency/include \
            -I../salts/cmeta/include \
            /tmp/streaming_sender_behavior.c \
            src/snapshot/raft_snapshot_sender.c \
            src/core/raft_configuration.c \
            -lcrypto \
            -o /tmp/streaming_sender_behavior
          /tmp/streaming_sender_behavior

      - name: Run streaming snapshot manager source-provider behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/streaming_manager_behavior.c <<'EOF'
          #include <turboraft/raft_snapshot_manager.h>
          #include <salts_error.h>

          #include <stdint.h>
          #include <string.h>

          typedef struct capture {
              tr_raft_transport_payload_t payload;
              size_t payload_count;
              size_t provider_count;
              size_t read_count;
              size_t release_count;
              size_t complete_count;
          } capture_t;

          static int read_at(void *context,
                             uint64_t offset,
                             uint8_t *buffer,
                             size_t capacity,
                             size_t *out_size)
          {
              static const uint8_t bytes[] = {0x72U,0x61U,0x66U,0x74U};
              capture_t *capture = (capture_t *)context;

              if (capture == NULL || out_size == NULL ||
                  offset > sizeof(bytes) ||
                  capacity > sizeof(bytes) - offset ||
                  (capacity != 0U && buffer == NULL))
                  return SALTS_EINVAL;
              if (capacity != 0U) {
                  memcpy(buffer, bytes + (size_t)offset, capacity);
              }
              *out_size = capacity;
              ++capture->read_count;
              return SALTS_OK;
          }

          static void release_source(void *context)
          {
              capture_t *capture = (capture_t *)context;
              if (capture != NULL) ++capture->release_count;
          }

          static int source_provider(
              void *context,
              tr_raft_index_t required_index,
              tr_raft_term_t required_term,
              tr_raft_snapshot_point_t *out_point,
              tr_raft_snapshot_source_t *out_source)
          {
              static const uint8_t digest[32] = {
                  0x76U,0xa3U,0x50U,0x72U,0xdfU,0x72U,0x59U,0x1aU,
                  0x65U,0x6eU,0x69U,0xcaU,0xb6U,0xf6U,0xfaU,0x99U,
                  0xaaU,0x38U,0x6fU,0xd5U,0xacU,0xe3U,0x5cU,0x90U,
                  0x42U,0x85U,0x1eU,0xb3U,0x24U,0xecU,0x16U,0xb5U
              };
              capture_t *capture = (capture_t *)context;

              if (capture == NULL || out_point == NULL ||
                  out_source == NULL || required_index != 10U ||
                  required_term != 7U)
                  return SALTS_EINVAL;

              memset(out_point, 0, sizeof(*out_point));
              out_point->index = 10U;
              out_point->term = 7U;
              out_point->configuration.phase = TR_RAFT_CONF_FINAL;
              out_point->configuration.transition_id = 9U;
              out_point->configuration.member_count = 2U;
              out_point->configuration.members[0].node_id = 1U;
              out_point->configuration.members[0].roles =
                  TR_RAFT_CONF_OLD_VOTER | TR_RAFT_CONF_NEW_VOTER;
              out_point->configuration.members[1].node_id = 2U;
              out_point->configuration.members[1].roles =
                  TR_RAFT_CONF_OLD_VOTER | TR_RAFT_CONF_NEW_VOTER;

              memset(out_source, 0, sizeof(*out_source));
              out_source->context = capture;
              out_source->size = 4U;
              memcpy(out_source->digest, digest, sizeof(digest));
              out_source->read_at = read_at;
              out_source->release = release_source;
              ++capture->provider_count;
              return SALTS_OK;
          }

          static int enqueue(void *context,
                             const tr_raft_transport_payload_t *payload)
          {
              capture_t *capture = (capture_t *)context;

              if (capture == NULL || payload == NULL ||
                  capture->payload_count != 0U)
                  return SALTS_ENOSPC;
              capture->payload = *payload;
              ++capture->payload_count;
              return SALTS_OK;
          }

          static int complete(void *context,
                              tr_raft_node_id_t peer_id,
                              tr_raft_index_t snapshot_index)
          {
              capture_t *capture = (capture_t *)context;

              if (capture == NULL || peer_id != 2U ||
                  snapshot_index != 10U)
                  return SALTS_EPROTO;
              ++capture->complete_count;
              return SALTS_OK;
          }

          int main(void)
          {
              const tr_raft_node_id_t peers[] = {2U};
              tr_raft_snapshot_manager_config_t config;
              tr_raft_snapshot_manager_t *manager = NULL;
              tr_raft_snapshot_request_t request;
              tr_raft_transport_payload_t ack;
              capture_t capture;

              memset(&config, 0, sizeof(config));
              memset(&request, 0, sizeof(request));
              memset(&ack, 0, sizeof(ack));
              memset(&capture, 0, sizeof(capture));

              config.self_id = 1U;
              config.group_id = 88U;
              config.peer_node_ids = peers;
              config.peer_count = 1U;
              config.max_snapshot_bytes = 1024U;
              config.snapshot_chunk_size = 512U;
              config.snapshot_max_inflight_chunks = 1U;
              config.enqueue = enqueue;
              config.enqueue_context = &capture;
              config.source_provider = source_provider;
              config.source_provider_context = &capture;
              config.complete = complete;
              config.complete_context = &capture;

              if (tr_raft_snapshot_manager_create(&config, &manager) !=
                  SALTS_OK) return 10;

              request.peer_id = 2U;
              request.leader_term = 8U;
              request.snapshot_index = 10U;
              request.snapshot_term = 7U;
              if (tr_raft_snapshot_manager_enqueue_request(
                      manager, &request) != SALTS_OK)
                  return 11;
              if (capture.provider_count != 1U ||
                  capture.read_count != 1U ||
                  capture.payload_count != 1U ||
                  capture.payload.group_id != 88U)
                  return 12;

              ack.group_id = 88U;
              ack.kind = TR_RAFT_WIRE_PAYLOAD_SNAPSHOT_ACK;
              ack.data.snapshot_ack.from = 2U;
              ack.data.snapshot_ack.to = 1U;
              ack.data.snapshot_ack.term = 8U;
              ack.data.snapshot_ack.snapshot_index = 10U;
              ack.data.snapshot_ack.snapshot_size = 4U;
              ack.data.snapshot_ack.next_offset = 4U;
              ack.data.snapshot_ack.accepted = true;
              memcpy(ack.data.snapshot_ack.snapshot_digest,
                     capture.payload.data.snapshot_chunk.snapshot_digest,
                     sizeof(ack.data.snapshot_ack.snapshot_digest));

              if (tr_raft_snapshot_manager_handle_payload(
                      manager, &ack) != SALTS_OK)
                  return 13;
              if (capture.release_count != 1U ||
                  capture.complete_count != 1U)
                  return 14;

              tr_raft_snapshot_manager_destroy(manager);
              return capture.release_count == 1U ? 0 : 15;
          }
          EOF

          cc -std=c11 -Wall -Wextra \
            -Iinclude \
            -Isrc/core \
            -Isrc/service \
            -I../salts/utils/include \
            -I../salts/platform/include \
            -I../salts/concurrency/include \
            -I../salts/cmeta/include \
            /tmp/streaming_manager_behavior.c \
            src/service/raft_snapshot_manager.c \
            src/service/raft_snapshot_peer.c \
            src/service/raft_snapshot_coordinator.c \
            src/snapshot/raft_snapshot_sender.c \
            src/core/raft_configuration.c \
            -lcrypto \
            -o /tmp/streaming_manager_behavior
          /tmp/streaming_manager_behavior

      - name: Run database-scale streaming snapshot receiver behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/streaming_receiver_behavior.c <<'EOF'
          #include <turboraft/raft_snapshot_receiver.h>
          #include <salts_error.h>
          #include <stdint.h>
          #include <string.h>

          typedef struct stream_capture {
              uint64_t expected_size;
              int begun;
              int aborted;
          } stream_capture_t;

          static int stream_begin(
              void *context,
              tr_raft_term_t leader_term,
              tr_raft_index_t snapshot_index,
              tr_raft_term_t snapshot_term,
              const tr_raft_conf_t *configuration,
              uint64_t snapshot_size)
          {
              stream_capture_t *capture = (stream_capture_t *)context;
              if (capture == NULL || leader_term != 5U ||
                  snapshot_index != 9U || snapshot_term != 4U ||
                  configuration == NULL ||
                  snapshot_size != capture->expected_size)
                  return SALTS_EPROTO;
              capture->begun = 1;
              return SALTS_OK;
          }

          static int stream_write(
              void *context,
              uint64_t offset,
              const uint8_t *data,
              size_t size)
          {
              (void)context;
              return offset == 0U && data != NULL && size == 1U
                         ? SALTS_OK
                         : SALTS_EPROTO;
          }

          static int stream_commit(void *context)
          {
              (void)context;
              return SALTS_OK;
          }

          static void stream_abort(void *context)
          {
              stream_capture_t *capture = (stream_capture_t *)context;
              if (capture != NULL)
                  capture->aborted = 1;
          }

          static int install(
              void *context,
              tr_raft_term_t leader_term,
              tr_raft_index_t snapshot_index,
              tr_raft_term_t snapshot_term,
              const tr_raft_conf_t *configuration,
              const uint8_t *data,
              size_t size)
          {
              (void)context;
              (void)leader_term;
              (void)snapshot_index;
              (void)snapshot_term;
              (void)configuration;
              (void)data;
              (void)size;
              return SALTS_OK;
          }

          static tr_raft_snapshot_chunk_t make_chunk(uint64_t snapshot_size)
          {
              static const uint8_t one = 0x5aU;
              tr_raft_snapshot_chunk_t chunk;

              memset(&chunk, 0, sizeof(chunk));
              chunk.from = 1U;
              chunk.to = 2U;
              chunk.term = 5U;
              chunk.snapshot_index = 9U;
              chunk.snapshot_term = 4U;
              chunk.snapshot_size = snapshot_size;
              chunk.has_configuration = true;
              chunk.configuration.phase = TR_RAFT_CONF_FINAL;
              chunk.configuration.member_count = 1U;
              chunk.configuration.members[0].node_id = 2U;
              chunk.configuration.members[0].roles =
                  TR_RAFT_CONF_OLD_VOTER | TR_RAFT_CONF_NEW_VOTER;
              chunk.data = &one;
              chunk.data_length = 1U;
              return chunk;
          }

          int main(void)
          {
              const uint64_t large_size =
                  UINT64_C(512) * 1024U * 1024U;
              tr_raft_snapshot_receiver_config_t config;
              tr_raft_snapshot_receiver_t *receiver = NULL;
              tr_raft_snapshot_receive_result_t result;
              tr_raft_snapshot_chunk_t chunk;
              stream_capture_t capture;

              memset(&config, 0, sizeof(config));
              memset(&capture, 0, sizeof(capture));
              capture.expected_size = large_size;
              config.self_id = 2U;
              config.max_snapshot_bytes = large_size;
              config.stream.begin = stream_begin;
              config.stream.write = stream_write;
              config.stream.commit = stream_commit;
              config.stream.abort = stream_abort;
              config.stream.context = &capture;

              if (tr_raft_snapshot_receiver_create(
                      &config, &receiver) != SALTS_OK)
                  return 10;
              chunk = make_chunk(large_size);
              if (tr_raft_snapshot_receiver_handle(
                      receiver, &chunk, &result) != SALTS_OK)
                  return 11;
              if (!capture.begun || result.ack.next_offset != 1U)
                  return 12;
              tr_raft_snapshot_receiver_destroy(receiver);
              if (!capture.aborted)
                  return 13;

              memset(&config, 0, sizeof(config));
              config.self_id = 2U;
              config.max_snapshot_bytes = 1024U;
              config.max_buffered_snapshot_bytes = 2U;
              config.install = install;
              if (tr_raft_snapshot_receiver_create(
                      &config, &receiver) != SALTS_OK)
                  return 20;
              {
                  static const uint8_t three[] = {0x61U, 0x62U, 0x63U};
                  chunk = make_chunk(3U);
                  chunk.data = three;
                  chunk.data_length = sizeof(three);
                  chunk.done = true;
              }
              if (tr_raft_snapshot_receiver_handle(
                      receiver, &chunk, &result) != SALTS_EFBIG)
                  return 21;
              tr_raft_snapshot_receiver_destroy(receiver);
              return 0;
          }
          EOF

