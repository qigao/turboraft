name: Windows MSVC Release

on:
  workflow_call:
    inputs:
      native-inputs-prepared:
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: turboraft-windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  VCPKG_CACHE_VERSION: ${{ vars.VCPKG_CACHE_VERSION }}
  CHTTP_REF: v2.1.0-rc.3

jobs:
  native-inputs:
    if: ${{ !inputs.native-inputs-prepared }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-native-inputs
        with:
          operation: prepare
          triplets: x64-windows
          token: ${{ secrets.GITHUB_TOKEN }}
  windows-x64:
    needs: native-inputs
    if: ${{ always() && !cancelled() && (inputs.native-inputs-prepared || needs.native-inputs.result == 'success') }}
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact TurboRaft head
        uses: actions/checkout@v4

      - name: Enable compiler cache
        uses: ./.github/actions/setup-sccache
        with:
          compiler: msvc
          configuration: Release
          profile: full-stack

      - name: Checkout selected infrastructure for source gates
        uses: actions/checkout@v4
        with:
          repository: qigao/vcpkg-cache
          ref: v${{ env.VCPKG_CACHE_VERSION }}
          path: .ci/vcpkg-cache
          persist-credentials: false

      - name: Bootstrap canonical vcpkg for CHttp source gate
        uses: ./.ci/vcpkg-cache/.github/actions/setup-vcpkg-curl-cache
        with:
          mode: read
          triplet: x64-windows
          host-triplet: x64-windows
          restore-packages: "false"

      - name: Restore released libraries and paired host tools
        uses: ./.github/actions/setup-native-inputs
        with:
          triplet: x64-windows
          host-rid: windows-x64
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout CHttp RC source
        uses: actions/checkout@v4
        with:
          repository: qigao/chttp
          ref: ${{ env.CHTTP_REF }}
          path: .ci/src/chttp
          persist-credentials: false

      - name: Prepare MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain not found"
          }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "TURBORAFT_VCPKG_TRIPLET=x64-windows" >> $env:GITHUB_ENV
          "QIGAO_VCPKG_WINDOWS_TRIPLET=x64-windows" >> $env:GITHUB_ENV
          "QIGAO_VCPKG_WINDOWS_HOST_TRIPLET=x64-windows" >> $env:GITHUB_ENV
          "QIGAO_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV
          "QIGAO_HOST_TRIPLET=x64-windows" >> $env:GITHUB_ENV
          "QIGAO_SDK_RID=windows-x64" >> $env:GITHUB_ENV
          "TURBORAFT_ROOT=$env:GITHUB_WORKSPACE\.ci\pkgs\turboraft" >> $env:GITHUB_ENV

      - name: Restore published Salts SDKs
        uses: ./.github/actions/setup-native-sdks
        with:
          rid: windows-x64
          token: ${{ secrets.GITHUB_TOKEN }}
          orm: "true"

      - name: Select source gate SDK outputs
        shell: pwsh
        run: |
          "CHTTP_ROOT=$env:GITHUB_WORKSPACE/.ci/src/chttp/stage/sdk/windows-x64" >> $env:GITHUB_ENV

      - name: Verify restored Salts SDK files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            (Join-Path $env:SALTS_ROOT "lib\cmake\Salts\SaltsConfig.cmake"),
            (Join-Path $env:SALTS_UTILS_ROOT "lib\cmake\SaltsUtils\SaltsUtilsConfig.cmake"),
            (Join-Path $env:SALTS_UTILS_ROOT "bin\salts-idlc.exe"))) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing restored SDK file: $path" }
          }

      - name: Build and install CHttp RC source
        shell: cmd
        working-directory: .ci/src/chttp
        run: |
          set "TURBORAFT_CACHE_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%TURBORAFT_CACHE_VCPKG_ROOT%"
          cmake --preset ci-sdk-release-user
          if errorlevel 1 exit /b 1
          cmake --build --preset ci-sdk-release-user --parallel 2
          if errorlevel 1 exit /b 1
          cmake --build --preset install-ci-sdk-release-user
          if errorlevel 1 exit /b 1

      - name: Configure and build TurboRaft Release
        shell: cmd
        run: |
          set "TURBORAFT_CACHE_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%TURBORAFT_CACHE_VCPKG_ROOT%"
          set "PATH=%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%CHTTP_ROOT%\bin;%GITHUB_WORKSPACE%\.ci\src\chttp\vcpkg_installed\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          cmake --fresh --preset ci-msvc-release-user
          if errorlevel 1 exit /b 1
          cmake --build --preset ci-msvc-release-user --parallel 2
          if errorlevel 1 exit /b 1

      - name: Run full Windows Release CTest
        shell: cmd
        run: |
          set "TURBORAFT_CACHE_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%TURBORAFT_CACHE_VCPKG_ROOT%"
          set "PATH=%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%CHTTP_ROOT%\bin;%GITHUB_WORKSPACE%\.ci\src\chttp\vcpkg_installed\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          ctest --preset ci-msvc-release-user
          if errorlevel 1 exit /b 1

      - name: Install TurboRaft Windows SDK
        shell: cmd
        run: |
          set "TURBORAFT_CACHE_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%TURBORAFT_CACHE_VCPKG_ROOT%"
          set "PATH=%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%CHTTP_ROOT%\bin;%GITHUB_WORKSPACE%\.ci\src\chttp\vcpkg_installed\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          cmake --build --preset install-ci-msvc-release-user
          if errorlevel 1 exit /b 1

      - name: Upload Windows CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboraft-windows-ctest-diagnostics
          path: |
            build/ci-msvc-release-user/Testing/Temporary
            .ci/src/chttp/build/native-sdk/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
