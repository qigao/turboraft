name: Windows MSVC Release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: turboraft-windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  FLOWMQ_REF: main
  CHTTP_REF: master

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact TurboRaft head
        uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Checkout FlowMQ main
        uses: actions/checkout@v4
        with:
          repository: qigao/flowmq
          ref: ${{ env.FLOWMQ_REF }}
          path: .ci/src/flowmq
          persist-credentials: false

      - name: Checkout CHttp master
        uses: actions/checkout@v4
        with:
          repository: qigao/chttp
          ref: ${{ env.CHTTP_REF }}
          path: .ci/src/chttp
          persist-credentials: false

      - name: Prepare MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain not found"
          }
          if ([string]::IsNullOrWhiteSpace($env:QIGAO_VCPKG_WINDOWS_TRIPLET)) {
            throw "canonical Qigao Windows vcpkg triplet is unavailable"
          }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "TURBORAFT_VCPKG_TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV
          "VCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE\.ci\vcpkg_installed_windows" >> $env:GITHUB_ENV
          "FLOWMQ_ROOT=$env:GITHUB_WORKSPACE\.ci\pkgs\flowmq" >> $env:GITHUB_ENV
          "CHTTP_ROOT=$env:GITHUB_WORKSPACE\.ci\pkgs\chttp" >> $env:GITHUB_ENV
          "TURBORAFT_ROOT=$env:GITHUB_WORKSPACE\.ci\pkgs\turboraft" >> $env:GITHUB_ENV

      - name: Restore published Salts SDKs
        uses: ./.github/actions/setup-native-sdks
        with:
          rid: windows-x64
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify restored Salts SDK files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @(
            (Join-Path $env:SALTS_ROOT "lib\cmake\Salts\SaltsConfig.cmake"),
            (Join-Path $env:SALTS_UTILS_ROOT "lib\cmake\SaltsUtils\SaltsUtilsConfig.cmake"),
            (Join-Path $env:SALTS_UTILS_ROOT "bin\salts-idlc.exe"))) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing restored SDK file: $path" }
          }

      - name: Bootstrap Windows vcpkg dependency union
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:VCPKG_INSTALLED_DIR | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE ".ci\super-manifest-windows"
          New-Item -ItemType Directory -Force -Path $manifest | Out-Null
          @'
          {
            "name": "turboraft-windows-ci",
            "version-semver": "0.1.0",
            "builtin-baseline": "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01",
            "dependencies": [
              "gmssl",
              { "name": "pkgconf", "host": true },
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "llhttp",
              "tree-sitter",
              "tree-sitter-c",
              "miniaudio",
              { "name": "zeromq", "default-features": false },
              { "name": "xxhash", "version>=": "0.8.3" }
            ]
          }
          '@ | Set-Content -LiteralPath (Join-Path $manifest "vcpkg.json")
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root=$manifest --x-install-root=$env:VCPKG_INSTALLED_DIR --triplet=$env:TURBORAFT_VCPKG_TRIPLET --host-triplet=$env:TURBORAFT_VCPKG_TRIPLET --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "vcpkg dependency bootstrap failed" }

      - name: Build and install CHttp master
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%VCPKG_INSTALLED_DIR%\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          cmake -S .ci\src\chttp -B .ci\build\chttp -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_HOST_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_INSTALLED_DIR="%VCPKG_INSTALLED_DIR%" -DVCPKG_MANIFEST_MODE=OFF -DCMAKE_INSTALL_PREFIX="%CHTTP_ROOT%" -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build .ci\build\chttp --target install --parallel 2
          if errorlevel 1 exit /b 1

      - name: Build and install FlowMQ main
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%VCPKG_INSTALLED_DIR%\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          cmake -S .ci\src\flowmq -B .ci\build\flowmq -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_HOST_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_INSTALLED_DIR="%VCPKG_INSTALLED_DIR%" -DVCPKG_MANIFEST_MODE=OFF -DCMAKE_INSTALL_PREFIX="%FLOWMQ_ROOT%" -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build .ci\build\flowmq --target install --parallel 2
          if errorlevel 1 exit /b 1

      - name: Configure and build TurboRaft Release
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%FLOWMQ_ROOT%\bin;%CHTTP_ROOT%\bin;%VCPKG_INSTALLED_DIR%\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          cmake -S . -B .ci\build\turboraft -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_HOST_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_INSTALLED_DIR="%VCPKG_INSTALLED_DIR%" -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_APPLOCAL_DEPS=OFF -DBUILD_TESTING=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build .ci\build\turboraft --parallel 2
          if errorlevel 1 exit /b 1

      - name: Run full Windows Release CTest
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "PATH=%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%FLOWMQ_ROOT%\bin;%CHTTP_ROOT%\bin;%VCPKG_INSTALLED_DIR%\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          ctest --test-dir .ci\build\turboraft --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Install TurboRaft Windows SDK
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "PATH=%SALTS_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%FLOWMQ_ROOT%\bin;%CHTTP_ROOT%\bin;%VCPKG_INSTALLED_DIR%\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          cmake --install .ci\build\turboraft --prefix "%TURBORAFT_ROOT%"
          if errorlevel 1 exit /b 1

      - name: Verify installed Core and FlowMQ package contracts
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          set "PATH=%TURBORAFT_ROOT%\bin;%CHTTP_ROOT%\bin;%FLOWMQ_ROOT%\bin;%SALTS_UTILS_ROOT%\bin;%SALTS_ROOT%\bin;%VCPKG_INSTALLED_DIR%\%TURBORAFT_VCPKG_TRIPLET%\bin;%PATH%"
          cmake -S tests\package_core_consumer -B .ci\build\package-core-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_HOST_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_INSTALLED_DIR="%VCPKG_INSTALLED_DIR%" -DVCPKG_MANIFEST_MODE=OFF
          if errorlevel 1 exit /b 1
          cmake --build .ci\build\package-core-windows --parallel 2
          if errorlevel 1 exit /b 1
          .ci\build\package-core-windows\turboraft_core_package_consumer.exe
          if errorlevel 1 exit /b 1
          cmake -S tests\package_flowmq_consumer -B .ci\build\package-flowmq-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_HOST_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_INSTALLED_DIR="%VCPKG_INSTALLED_DIR%" -DVCPKG_MANIFEST_MODE=OFF
          if errorlevel 1 exit /b 1
          cmake --build .ci\build\package-flowmq-windows --parallel 2
          if errorlevel 1 exit /b 1
          .ci\build\package-flowmq-windows\turboraft_flowmq_package_consumer.exe
          if errorlevel 1 exit /b 1

          cmake -S tests\package_control_plane_consumer -B .ci\build\package-control-plane-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_HOST_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_INSTALLED_DIR="%VCPKG_INSTALLED_DIR%" -DVCPKG_MANIFEST_MODE=OFF
          if errorlevel 1 exit /b 1
          cmake --build .ci\build\package-control-plane-windows --parallel 2
          if errorlevel 1 exit /b 1
          .ci\build\package-control-plane-windows\turboraft_control_plane_package_consumer.exe
          if errorlevel 1 exit /b 1

          for /f %%C in ('python tests\package_component_consumer\list_components.py full') do (
            cmake -S tests\package_component_consumer -B ".ci\build\package-component-%%C" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_HOST_TRIPLET=%TURBORAFT_VCPKG_TRIPLET% -DVCPKG_INSTALLED_DIR="%VCPKG_INSTALLED_DIR%" -DVCPKG_MANIFEST_MODE=OFF -DTURBORAFT_COMPONENT=%%C
            if errorlevel 1 exit /b 1
            cmake --build ".ci\build\package-component-%%C" --parallel 2
            if errorlevel 1 exit /b 1
            ".ci\build\package-component-%%C\turboraft_component_package_consumer.exe"
            if errorlevel 1 exit /b 1
          )

      - name: Upload Windows CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboraft-windows-ctest-diagnostics
          path: .ci/build/turboraft/Testing/Temporary
          if-no-files-found: ignore
