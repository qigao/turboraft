name: Proposal path benchmark

on:
  push:
    branches:
      - feature/proposal-batching-benchmark
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TurboRaft
        uses: actions/checkout@v4

      - name: Checkout public dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/qigao/salts.git ../salts
          git clone --depth 1 https://github.com/Cyan4973/xxHash.git ../xxhash

      - name: Build and run proposal durability benchmark
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bench_fs.c <<'EOF'
          #include <salts_fs.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <stdint.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <unistd.h>

          static int neg_errno(void) { return -errno; }

          salts_file_t salts_fs_open(const char *path, int flags, int mode)
          {
              int native = 0;
              if (flags & SALTS_FS_O_RDWR) native |= O_RDWR;
              else if (flags & SALTS_FS_O_WRONLY) native |= O_WRONLY;
              else native |= O_RDONLY;
              if (flags & SALTS_FS_O_CREAT) native |= O_CREAT;
              if (flags & SALTS_FS_O_TRUNC) native |= O_TRUNC;
              if (flags & SALTS_FS_O_APPEND) native |= O_APPEND;
              return open(path, native, mode);
          }

          int salts_fs_close(salts_file_t fd)
          { return close(fd) == 0 ? 0 : neg_errno(); }

          int salts_fs_write(salts_file_t fd, const char *data, size_t len)
          {
              ssize_t n = write(fd, data, len);
              return n < 0 ? neg_errno() : (int)n;
          }

          int salts_fs_pread(salts_file_t fd, char *buf, size_t len,
                             int64_t offset)
          {
              ssize_t n = pread(fd, buf, len, (off_t)offset);
              return n < 0 ? neg_errno() : (int)n;
          }

          int salts_fs_pwrite(salts_file_t fd, const char *data, size_t len,
                              int64_t offset)
          {
              ssize_t n = pwrite(fd, data, len, (off_t)offset);
              return n < 0 ? neg_errno() : (int)n;
          }

          int salts_fs_fsync(salts_file_t fd)
          { return fsync(fd) == 0 ? 0 : neg_errno(); }

          int salts_fs_ftruncate(salts_file_t fd, int64_t length)
          { return ftruncate(fd, (off_t)length) == 0 ? 0 : neg_errno(); }

          int64_t salts_fs_seek(salts_file_t fd, int64_t offset, int whence)
          {
              off_t value = lseek(fd, (off_t)offset, whence);
              return value < 0 ? (int64_t)neg_errno() : (int64_t)value;
          }

          int salts_fs_stat(const char *path, salts_fs_stat_t *out)
          {
              struct stat st;
              if (out == NULL) return -EINVAL;
              if (stat(path, &st) != 0) return neg_errno();
              memset(out, 0, sizeof(*out));
              out->size = (uint64_t)st.st_size;
              out->mode = (int)st.st_mode;
              out->is_file = S_ISREG(st.st_mode);
              out->is_directory = S_ISDIR(st.st_mode);
              return 0;
          }

          int salts_fs_access(const char *path, int mode)
          {
              int native = F_OK;
              if (mode & SALTS_FS_ACCESS_READ) native |= R_OK;
              if (mode & SALTS_FS_ACCESS_WRITE) native |= W_OK;
              if (mode & SALTS_FS_ACCESS_EXEC) native |= X_OK;
              return access(path, native) == 0 ? 0 : neg_errno();
          }

          int salts_fs_unlink(const char *path)
          { return unlink(path) == 0 ? 0 : neg_errno(); }

          int salts_fs_rename(const char *old_path, const char *new_path)
          { return rename(old_path, new_path) == 0 ? 0 : neg_errno(); }

          int salts_fs_lock(salts_file_t fd, int flags, int64_t offset,
                            uint64_t len)
          {
              struct flock lock;
              memset(&lock, 0, sizeof(lock));
              lock.l_type = (flags & SALTS_FS_LOCK_EXCLUSIVE) ? F_WRLCK : F_RDLCK;
              lock.l_whence = SEEK_SET;
              lock.l_start = (off_t)offset;
              lock.l_len = (off_t)len;
              return fcntl(fd,
                           (flags & SALTS_FS_LOCK_NONBLOCK) ? F_SETLK : F_SETLKW,
                           &lock) == 0 ? 0 : neg_errno();
          }

          int salts_fs_unlock(salts_file_t fd, int64_t offset, uint64_t len)
          {
              struct flock lock;
              memset(&lock, 0, sizeof(lock));
              lock.l_type = F_UNLCK;
              lock.l_whence = SEEK_SET;
              lock.l_start = (off_t)offset;
              lock.l_len = (off_t)len;
              return fcntl(fd, F_SETLK, &lock) == 0 ? 0 : neg_errno();
          }
          EOF

          cc -std=c11 -O2 -D_DEFAULT_SOURCE=1 -D_POSIX_C_SOURCE=200809L \
            -Iinclude -Isrc -Isrc/core \
            -I../salts/utils/include -I../salts/platform/include \
            -I../salts/cstl/include -I../salts/cmeta/include \
            -I../xxhash \
            benchmarks/benchmark_proposal_path.c \
            src/service/raft_service.c src/runtime/raft_runtime.c \
            src/core/raft_core.c src/core/raft_configuration.c \
            src/core/raft_membership.c src/core/raft_membership_transition.c \
            src/core/raft_peer_set.c src/core/raft_log.c \
            src/storage/raft_wal_storage.c \
            ../salts/cstl/src/vec.c ../xxhash/xxhash.c \
            /tmp/bench_fs.c -lcrypto \
            -o /tmp/turboraft_proposal_path_bench

          /tmp/turboraft_proposal_path_bench | tee /tmp/proposal-path.csv
          {
            echo "### Proposal path benchmark"
            echo '~~~text'
            cat /tmp/proposal-path.csv
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: proposal-path-benchmark
          path: /tmp/proposal-path.csv
