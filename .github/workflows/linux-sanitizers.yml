name: Linux sanitizer matrix

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: turboraft-sanitizers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  VCPKG_BASELINE: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  SALTS_REF: master
  SALTS_UTILS_REF: master
  FLOWMQ_REF: main
  ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

jobs:
  sanitizer:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
            cmake_flags: -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED=OFF
          - name: ubsan
            cmake_flags: -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=ON
          - name: tsan
            cmake_flags: -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF -DENABLE_SANITIZER_THREAD=ON
    env:
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.ci/vcpkg_installed_${{ matrix.name }}
      SALTS_ROOT: ${{ github.workspace }}/.ci/pkgs-${{ matrix.name }}/salts
      SALTS_UTILS_ROOT: ${{ github.workspace }}/.ci/pkgs-${{ matrix.name }}/salts-utils
      FLOWMQ_ROOT: ${{ github.workspace }}/.ci/pkgs-${{ matrix.name }}/flowmq
      LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/pkgs-${{ matrix.name }}/flowmq/lib:${{ github.workspace }}/.ci/pkgs-${{ matrix.name }}/salts-utils/lib:${{ github.workspace }}/.ci/pkgs-${{ matrix.name }}/salts/lib:${{ github.workspace }}/.ci/vcpkg_installed_${{ matrix.name }}/x64-linux/debug/lib:${{ github.workspace }}/.ci/vcpkg_installed_${{ matrix.name }}/x64-linux/lib
    steps:
      - name: Checkout exact TurboRaft head
        uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Checkout Salts master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_REF }}
          path: .ci/src-${{ matrix.name }}/salts
          persist-credentials: false

      - name: Checkout SaltsUtils master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_REF }}
          path: .ci/src-${{ matrix.name }}/salts-utils
          persist-credentials: false

      - name: Checkout FlowMQ main
        uses: actions/checkout@v4
        with:
          repository: qigao/flowmq
          ref: ${{ env.FLOWMQ_REF }}
          path: .ci/src-${{ matrix.name }}/flowmq
          persist-credentials: false

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libtool nasm ninja-build pkg-config

      - name: Bootstrap vcpkg dependency union
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VCPKG_INSTALLED_DIR" ".ci/super-manifest-${{ matrix.name }}"
          cat > ".ci/super-manifest-${{ matrix.name }}/vcpkg.json" <<'JSON'
          {
            "name": "turboraft-sanitizer-ci",
            "version-semver": "0.1.0",
            "builtin-baseline": "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01",
            "dependencies": [
              { "name": "pkgconf", "host": true },
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "boringssl",
              "miniaudio",
              "lua",
              { "name": "zeromq", "default-features": false },
              { "name": "xxhash", "version>=": "0.8.3" }
            ]
          }
          JSON
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/.ci/super-manifest-${{ matrix.name }}" \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --triplet=x64-linux

      - name: Build and install Salts Debug
        shell: bash
        run: |
          set -euo pipefail
          cmake -S ".ci/src-${{ matrix.name }}/salts" \
            -B ".ci/build-${{ matrix.name }}/salts" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$SALTS_ROOT" \
            -DENABLE_ASAN=OFF -DENABLE_SANITIZER_ADDRESS=OFF \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF
          cmake --build ".ci/build-${{ matrix.name }}/salts" --target install --parallel 2

      - name: Build and install SaltsUtils Debug
        shell: bash
        run: |
          set -euo pipefail
          cmake -S ".ci/src-${{ matrix.name }}/salts-utils" \
            -B ".ci/build-${{ matrix.name }}/salts-utils" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$SALTS_UTILS_ROOT" \
            -DENABLE_ASAN=OFF -DENABLE_SANITIZER_ADDRESS=OFF \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF -DSALTS_UTILS_ENABLE_CFLOW_USB=OFF
          cmake --build ".ci/build-${{ matrix.name }}/salts-utils" --target install --parallel 2
          test -x "$SALTS_UTILS_ROOT/bin/tbe_compiler"

      - name: Build and install FlowMQ Debug
        shell: bash
        run: |
          set -euo pipefail
          cmake -S ".ci/src-${{ matrix.name }}/flowmq" \
            -B ".ci/build-${{ matrix.name }}/flowmq" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$FLOWMQ_ROOT" \
            -DENABLE_ASAN=OFF \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build ".ci/build-${{ matrix.name }}/flowmq" --target install --parallel 2

      - name: Configure TurboRaft Debug with ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B ".ci/build-${{ matrix.name }}/turboraft" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            ${{ matrix.cmake_flags }}

      - name: Build TurboRaft Debug with ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          cmake --build ".ci/build-${{ matrix.name }}/turboraft" --parallel 2

      - name: Run focused production gates with ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir ".ci/build-${{ matrix.name }}/turboraft" \
            -R 'turboraft\.(flowmq_peer_service|multiprocess_chaos|apply_ack|cflow_state_machine)$' \
            --output-on-failure

      - name: Run full CTest with ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir ".ci/build-${{ matrix.name }}/turboraft" \
            --output-on-failure

      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboraft-${{ matrix.name }}-diagnostics
          path: .ci/build-${{ matrix.name }}/turboraft/Testing/Temporary
          if-no-files-found: ignore
