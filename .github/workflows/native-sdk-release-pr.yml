name: TurboRaft release merge publish
# Release trigger for v0.3.1 after qualified merge.

on:
  push:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/native-sdk-pipeline.yml"
      - ".github/workflows/native-sdk-release-pr.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: turboraft-release-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    uses: ./.github/workflows/native-sdk-pipeline.yml
    with:
      publish: true
      source_sha: ${{ github.sha }}
    secrets: inherit
