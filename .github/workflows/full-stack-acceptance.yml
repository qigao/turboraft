name: Full TurboRaft stack acceptance

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - feature/multi-group-wire
      - feature/multi-group-multiplex
      - feature/streaming-snapshot
      - feature/multigroup-chaos
      - feature/concurrent-readindex
      - feature/streaming-data-plane
      - feature/proposal-batching-benchmark
  workflow_dispatch:

concurrency:
  group: full-turboraft-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  VCPKG_BASELINE: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01

  FLOWMQ_REF: d532a27b30b7078b3a7575f8e5a2d370573fd145 # v1.3.0 qualified source SHA
  CHTTP_REF: master
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.ci/vcpkg_installed

  FLOWMQ_ROOT: ${{ github.workspace }}/.ci/pkgs/flowmq
  CHTTP_ROOT: ${{ github.workspace }}/.ci/pkgs/chttp
  LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/pkgs/chttp/lib:${{ github.workspace }}/.ci/pkgs/flowmq/lib:${{ github.workspace }}/.ci/vcpkg_installed/x64-linux/lib

jobs:
  full-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact TurboRaft stack
        uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Restore published Salts SDKs
        uses: ./.github/actions/setup-native-sdks
        with:
          rid: linux-x64
          token: ${{ secrets.GITHUB_TOKEN }}
          salts_native_candidate_version: ${{ vars.TURBORAFT_SALTS_ACE_CANDIDATE_VERSION }}
          salts_utils_native_version: ${{ vars.TURBORAFT_SALTS_UTILS_NATIVE_VERSION }}
          flowmq_native_version: '1.3.0'
          chttp_native_version: ${{ vars.TURBORAFT_CHTTP_NATIVE_VERSION }}

      - name: Checkout exact FlowMQ v1.3.0 source
        uses: actions/checkout@v4
        with:
          repository: qigao/flowmq
          ref: ${{ env.FLOWMQ_REF }}
          path: .ci/src/flowmq
          persist-credentials: false

      - name: Verify FlowMQ v1.3.0 release source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .ci/src/flowmq rev-parse HEAD)" = "$FLOWMQ_REF"
          grep -F "VERSION 1.3.0" .ci/src/flowmq/CMakeLists.txt

      - name: Checkout CHttp master
        uses: actions/checkout@v4
        with:
          repository: qigao/chttp
          ref: ${{ env.CHTTP_REF }}
          path: .ci/src/chttp
          persist-credentials: false

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libtool nasm ninja-build pkg-config ccache

      - name: Restore ccache (full-release)
        uses: ./.github/actions/setup-ccache
        with:
          scope: full-release

      - name: Bootstrap vcpkg and install the dependency union
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/vcpkg_installed .ci/super-manifest
          cat > .ci/super-manifest/vcpkg.json <<'JSON'
          {
            "name": "turboraft-full-stack-ci",
            "version-semver": "0.1.0",
            "builtin-baseline": "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01",
            "dependencies": [
              { "name": "pkgconf", "host": true },
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "gmssl",
              "llhttp",
              "tree-sitter",
              "tree-sitter-c",
              "miniaudio",
              { "name": "zeromq", "default-features": false },
              { "name": "xxhash", "version>=": "0.8.3" }
            ]
          }
          JSON
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/.ci/super-manifest" \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --only-binarycaching \
            --triplet=x64-linux

      - name: Smoke focused source build profiles
        shell: bash
        env:
          FLOWMQ_ROOT: ""
          CHTTP_ROOT: ""
        run: |
          set -euo pipefail
          for profile in core-dev storage-dev; do
            build_dir=".ci/build/profile-$profile"
            cmake -S . -B "$build_dir" -G Ninja               -DCMAKE_BUILD_TYPE=Release               -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"               -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"               -DVCPKG_TARGET_TRIPLET=x64-linux               -DVCPKG_MANIFEST_MODE=OFF               -DTURBORAFT_BUILD_PROFILE="$profile"               -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF               -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
            cmake --build "$build_dir" --parallel 2
          done

      - name: Verify full profile fail-fast boundaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/build/profile-missing-flowmq
          if FLOWMQ_ROOT="" CHTTP_ROOT="" cmake -S .               -B .ci/build/profile-missing-flowmq -G Ninja               -DCMAKE_BUILD_TYPE=Release               -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"               -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR"               -DVCPKG_TARGET_TRIPLET=x64-linux               -DVCPKG_MANIFEST_MODE=OFF               -DTURBORAFT_BUILD_PROFILE=full               -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF               >.ci/build/profile-missing-flowmq.log 2>&1; then
            echo "full profile unexpectedly configured without FLOWMQ_ROOT" >&2
            exit 1
          fi
          grep -F "FLOWMQ_ROOT" .ci/build/profile-missing-flowmq.log

          rm -rf .ci/build/profile-missing-re2c
          if cmake -S . -B .ci/build/profile-missing-re2c -G Ninja               -DCMAKE_BUILD_TYPE=Release               -DRE2C_EXECUTABLE=/definitely/missing/re2c               -DTURBORAFT_BUILD_PROFILE=full               -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF               >.ci/build/profile-missing-re2c.log 2>&1; then
            echo "full profile unexpectedly configured with missing re2c" >&2
            exit 1
          fi
          grep -F "existing runnable re2c executable"             .ci/build/profile-missing-re2c.log

      - name: Build and install CHttp master
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/chttp -B .ci/build/chttp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$CHTTP_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build .ci/build/chttp --target install --parallel 2

      - name: Build and install FlowMQ v1.3.0
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/flowmq -B .ci/build/flowmq -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$FLOWMQ_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build .ci/build/flowmq --target install --parallel 2

      - name: Validate installed dependency roots
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -x "$SALTS_UTILS_ROOT/bin/salts-idlc"
          test -f "$FLOWMQ_ROOT/lib/cmake/FlowMQ/FlowMQConfig.cmake"
          test -f "$CHTTP_ROOT/lib/cmake/Chttp/ChttpConfig.cmake"

      - name: Configure TurboRaft Release with tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B .ci/build/turboraft -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF

      - name: Build TurboRaft Release
        shell: bash
        run: |
          set -euo pipefail
          cmake --build .ci/build/turboraft --parallel 2

      - name: Install TurboRaft SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake --install .ci/build/turboraft \
            --prefix "$GITHUB_WORKSPACE/.ci/pkgs/turboraft"

      - name: Verify installed Core package and ABI contract
        shell: bash
        env:
          TURBORAFT_ROOT: ${{ github.workspace }}/.ci/pkgs/turboraft
        run: |
          set -euo pipefail
          cmake -S tests/package_core_consumer \
            -B .ci/build/package-core-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build .ci/build/package-core-consumer --parallel 2
          .ci/build/package-core-consumer/turboraft_core_package_consumer

      - name: Verify installed CFlowStateMachine package contract
        shell: bash
        env:
          TURBORAFT_ROOT: ${{ github.workspace }}/.ci/pkgs/turboraft
        run: |
          set -euo pipefail
          cmake -S tests/package_cflow_consumer \
            -B .ci/build/package-cflow-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build .ci/build/package-cflow-consumer --parallel 2
          .ci/build/package-cflow-consumer/turboraft_cflow_package_consumer

      - name: Verify installed FlowMQ peer identity package contract
        shell: bash
        env:
          TURBORAFT_ROOT: ${{ github.workspace }}/.ci/pkgs/turboraft
        run: |
          set -euo pipefail
          cmake -S tests/package_flowmq_consumer \
            -B .ci/build/package-flowmq-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build .ci/build/package-flowmq-consumer --parallel 2
          .ci/build/package-flowmq-consumer/turboraft_flowmq_package_consumer

      - name: Verify installed ControlPlane package contract
        shell: bash
        env:
          TURBORAFT_ROOT: ${{ github.workspace }}/.ci/pkgs/turboraft
        run: |
          set -euo pipefail
          cmake -S tests/package_control_plane_consumer \
            -B .ci/build/package-control-plane-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build .ci/build/package-control-plane-consumer --parallel 2
          .ci/build/package-control-plane-consumer/turboraft_control_plane_package_consumer

      - name: Verify complete installed component matrix
        shell: bash
        env:
          TURBORAFT_ROOT: ${{ github.workspace }}/.ci/pkgs/turboraft
        run: |
          set -euo pipefail
          mapfile -t components < <(
            python3 tests/package_component_consumer/list_components.py full
          )
          for component in "${components[@]}"; do
            build_dir=".ci/build/package-component-${component}"
            cmake -S tests/package_component_consumer -B "$build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
              -DVCPKG_TARGET_TRIPLET=x64-linux \
              -DVCPKG_MANIFEST_MODE=OFF \
              -DTURBORAFT_COMPONENT="$component"
            cmake --build "$build_dir" --parallel 2
            "$build_dir/turboraft_component_package_consumer"
          done

      - name: Full Release CTest
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir .ci/build/turboraft --output-on-failure

      - name: Report ccache statistics
        if: always()
        shell: bash
        run: ccache --show-stats

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-ctest-diagnostics
          path: .ci/build/turboraft/Testing/Temporary
          if-no-files-found: ignore
