name: Full TurboRaft stack acceptance

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: full-turboraft-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  VCPKG_BASELINE: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  FLOWMQ_REF: 0043393a5b287e71a78601d5d71586ef0f3e044a
  VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.ci/vcpkg_installed
  SALTS_VERSION: 1.1.0
  SALTS_UTILS_VERSION: 2.0.0
  FLOWMQ_ROOT: ${{ github.workspace }}/.ci/pkgs/flowmq
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.ci/vcpkg-bincache,readwrite
  LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/pkgs/flowmq/lib:${{ github.workspace }}/.ci/vcpkg_installed/x64-linux/lib

jobs:
  full-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact TurboRaft stack
        uses: actions/checkout@v4

      - name: Checkout pinned FlowMQ
        uses: actions/checkout@v4
        with:
          repository: qigao/flowmq
          ref: ${{ env.FLOWMQ_REF }}
          path: .ci/src/flowmq
          persist-credentials: false

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_BASELINE }}
          path: .ci/vcpkg
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore versioned Salts SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/qigao-native-sdk"
          config="$RUNNER_TEMP/qigao-native-sdk.config"
          project="$RUNNER_TEMP/qigao-native-sdk.csproj"
          cat > "$config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration><packageSources><clear /></packageSources></configuration>
          EOF
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="[$SALTS_VERSION]" />
              <PackageReference Include="SaltsUtils.Native" Version="[$SALTS_UTILS_VERSION]" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --packages "$packages" --configfile "$config" --no-cache
          salts_root="$packages/salts.native/$SALTS_VERSION/sdk/linux-x64"
          salts_utils_root="$packages/saltsutils.native/$SALTS_UTILS_VERSION/sdk/linux-x64"
          test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$salts_utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$salts_utils_root/bin/tbe_compiler"
          chmod +x "$salts_utils_root/bin/tbe_compiler"
          echo "SALTS_ROOT=$salts_root" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$salts_utils_root" >> "$GITHUB_ENV"
          echo "$salts_utils_root/bin" >> "$GITHUB_PATH"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libtool nasm ninja-build pkg-config

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci/vcpkg-bincache
          key: vcpkg-linux-${{ env.VCPKG_BASELINE }}-turboraft-full-v1

      - name: Bootstrap vcpkg and install the dependency union
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/vcpkg-bincache .ci/vcpkg_installed .ci/super-manifest
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          cat > .ci/super-manifest/vcpkg.json <<'JSON'
          {
            "name": "turboraft-full-stack-ci",
            "version-semver": "0.1.0",
            "builtin-baseline": "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01",
            "dependencies": [
              { "name": "pkgconf", "host": true },
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "boringssl",
              "miniaudio",
              "lua",
              { "name": "zeromq", "default-features": false },
              { "name": "xxhash", "version>=": "0.8.3" }
            ],
            "overrides": [
              { "name": "c-ares", "version": "1.34.5", "port-version": 1 }
            ]
          }
          JSON
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/.ci/super-manifest" \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --triplet=x64-linux

      - name: Save vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci/vcpkg-bincache
          key: vcpkg-linux-${{ env.VCPKG_BASELINE }}-turboraft-full-v1

      - name: Build and install pinned FlowMQ
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/flowmq -B .ci/build/flowmq -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$FLOWMQ_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build .ci/build/flowmq --target install --parallel 2

      - name: Validate installed dependency roots
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -x "$SALTS_UTILS_ROOT/bin/tbe_compiler"
          test -f "$FLOWMQ_ROOT/lib/cmake/FlowMQ/FlowMQConfig.cmake"

      - name: Configure TurboRaft Release with tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B .ci/build/turboraft -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF

      - name: Build TurboRaft Release
        shell: bash
        run: |
          set -euo pipefail
          cmake --build .ci/build/turboraft --parallel 2

      - name: Targeted production integration gates
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir .ci/build/turboraft \
            -R 'turboraft\.(flowmq_peer_service|multiprocess_chaos)$' \
            --output-on-failure

      - name: Full Release CTest
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir .ci/build/turboraft --output-on-failure

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-ctest-diagnostics
          path: .ci/build/turboraft/Testing/Temporary
          if-no-files-found: ignore
