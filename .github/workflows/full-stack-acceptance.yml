name: Full TurboRaft stack acceptance

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: full-turboraft-stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  VCPKG_BASELINE: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  SALTS_REF: master
  SALTS_UTILS_REF: master
  FLOWMQ_REF: main
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.ci/vcpkg_installed
  SALTS_ROOT: ${{ github.workspace }}/.ci/pkgs/salts
  SALTS_UTILS_ROOT: ${{ github.workspace }}/.ci/pkgs/salts-utils
  FLOWMQ_ROOT: ${{ github.workspace }}/.ci/pkgs/flowmq
  LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/pkgs/flowmq/lib:${{ github.workspace }}/.ci/pkgs/salts-utils/lib:${{ github.workspace }}/.ci/pkgs/salts/lib:${{ github.workspace }}/.ci/vcpkg_installed/x64-linux/lib

jobs:
  full-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact TurboRaft stack
        uses: actions/checkout@v4

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Checkout Salts master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: ${{ env.SALTS_REF }}
          path: .ci/src/salts
          persist-credentials: false

      - name: Checkout SaltsUtils master
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ${{ env.SALTS_UTILS_REF }}
          path: .ci/src/salts-utils
          persist-credentials: false

      - name: Checkout FlowMQ main
        uses: actions/checkout@v4
        with:
          repository: qigao/flowmq
          ref: ${{ env.FLOWMQ_REF }}
          path: .ci/src/flowmq
          persist-credentials: false

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libtool nasm ninja-build pkg-config



      - name: Bootstrap vcpkg and install the dependency union
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/vcpkg_installed .ci/super-manifest
          cat > .ci/super-manifest/vcpkg.json <<'JSON'
          {
            "name": "turboraft-full-stack-ci",
            "version-semver": "0.1.0",
            "builtin-baseline": "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01",
            "dependencies": [
              { "name": "pkgconf", "host": true },
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "boringssl",
              "miniaudio",
              "lua",
              { "name": "zeromq", "default-features": false },
              { "name": "xxhash", "version>=": "0.8.3" }
            ]
          }
          JSON
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/.ci/super-manifest" \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --triplet=x64-linux


      - name: Build and install Salts master
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/salts -B .ci/build/salts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$SALTS_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF
          cmake --build .ci/build/salts --target install --parallel 2

      - name: Build and install SaltsUtils master
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/salts-utils -B .ci/build/salts-utils -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$SALTS_UTILS_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF -DSALTS_UTILS_ENABLE_CFLOW_USB=OFF
          cmake --build .ci/build/salts-utils --target install --parallel 2
          test -x "$SALTS_UTILS_ROOT/bin/tbe_compiler"

      - name: Build and install FlowMQ main
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/flowmq -B .ci/build/flowmq -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$FLOWMQ_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build .ci/build/flowmq --target install --parallel 2

      - name: Validate installed dependency roots
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -x "$SALTS_UTILS_ROOT/bin/tbe_compiler"
          test -f "$FLOWMQ_ROOT/lib/cmake/FlowMQ/FlowMQConfig.cmake"

      - name: Configure TurboRaft Release with tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B .ci/build/turboraft -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF

      - name: Build TurboRaft Release
        shell: bash
        run: |
          set -euo pipefail
          cmake --build .ci/build/turboraft --parallel 2

      - name: Install TurboRaft SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake --install .ci/build/turboraft \
            --prefix "$GITHUB_WORKSPACE/.ci/pkgs/turboraft"

      - name: Verify installed Core package and ABI contract
        shell: bash
        env:
          TURBORAFT_ROOT: ${{ github.workspace }}/.ci/pkgs/turboraft
        run: |
          set -euo pipefail
          cmake -S tests/package_core_consumer \
            -B .ci/build/package-core-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build .ci/build/package-core-consumer --parallel 2
          .ci/build/package-core-consumer/turboraft_core_package_consumer

      - name: Verify installed CFlowStateMachine package contract
        shell: bash
        env:
          TURBORAFT_ROOT: ${{ github.workspace }}/.ci/pkgs/turboraft
        run: |
          set -euo pipefail
          cmake -S tests/package_cflow_consumer \
            -B .ci/build/package-cflow-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build .ci/build/package-cflow-consumer --parallel 2
          .ci/build/package-cflow-consumer/turboraft_cflow_package_consumer

      - name: Verify installed FlowMQ peer identity package contract
        shell: bash
        env:
          TURBORAFT_ROOT: ${{ github.workspace }}/.ci/pkgs/turboraft
        run: |
          set -euo pipefail
          cmake -S tests/package_flowmq_consumer \
            -B .ci/build/package-flowmq-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF
          cmake --build .ci/build/package-flowmq-consumer --parallel 2
          .ci/build/package-flowmq-consumer/turboraft_flowmq_package_consumer

      - name: Targeted production integration gates
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir .ci/build/turboraft \
            -R 'turboraft\.(flowmq_peer_service|multiprocess_chaos)$' \
            --output-on-failure

      - name: Full Release CTest
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir .ci/build/turboraft --output-on-failure

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-ctest-diagnostics
          path: .ci/build/turboraft/Testing/Temporary
          if-no-files-found: ignore
